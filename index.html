<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sambrit Adhikari</title>
  <meta name="description" content="Sambrit Adhikari, a program manager and engineer specializing in AI, machine learning, and software development."/>
  <meta name="keywords" content="Sambrit Adhikari, program manager, engineer, software development, AI, machine learning, LinkedIn, program management, product manager, technical program manager, artificial intelligence, data science"/>
  <meta name="author" content="Sambrit Adhikari"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://www.sambrit.com/"/>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">

  <style>
  :root {
    --text: #FAFAFA;
    --accent: #FFD700;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #0a0d14 0%, #0b1020 50%, #0d1428 100%);
    overflow: hidden;
    position: relative;
  }

  #bg, #snow {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    pointer-events: none;
  }

  #bg { z-index: 0; }
  #snow { z-index: 4; }

  .glow {
    position: fixed;
    inset: -10vmax;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(38vmax 38vmax at 20% 22%, rgba(71, 222, 232, 0.14), transparent 62%),
      radial-gradient(35vmax 35vmax at 80% 73%, rgba(250, 204, 21, 0.10), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 58%, rgba(244, 114, 182, 0.08), transparent 68%);
    filter: blur(9px);
  }

  .main-content {
    position: relative;
    z-index: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }

  .kicker, .name, .nav-links { position: relative; z-index: 6; }

  .kicker {
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.72rem;
    font-weight: 700;
    color: #BFFBFF;
    text-shadow: 0 2px 8px rgba(0,0,0,0.62);
  }

  .name {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    margin: 10px 0 0;
    color: var(--accent);
    letter-spacing: .6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  .nav-links {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-link {
    text-decoration: none;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,.35);
    padding: 10px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    backdrop-filter: blur(6px);
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .nav-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(0,0,0,.35);
    background: rgba(255,255,255,.08);
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }

  .modal[hidden] {
    display: none;
  }

  .modal-card {
    background: rgba(15,15,20,0.9);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    width: min(92vw, 380px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal-title {
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: 0.3px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform .15s ease, background .15s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.12);
  }

  .btn.primary {
    background: linear-gradient(90deg, #facc15, #22d3ee);
    color: #0a0a0a;
    font-weight: 800;
    border: none;
  }

  .launch-button {
    position: fixed;
    z-index: 8;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom));
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #0a0a0a;
    background: var(--accent);
    border: none;
    cursor: pointer;
    user-select: none;
    transition: transform .2s ease, filter .2s ease;
    touch-action: manipulation;
  }

  .launch-button:hover {
    transform: translateX(-50%) translateY(-2px);
    filter: brightness(1.08);
  }

  .launch-button:active {
    transform: translateX(-50%) scale(0.97);
  }

  .rocket {
    position: fixed;
    font-size: 2rem;
    z-index: 9;
    pointer-events: none;
    animation: rocketFly 3.2s forwards cubic-bezier(.2,.6,.3,1);
  }

  .holiday-toggle {
    position: fixed;
    z-index: 8;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(8,10,16,.66);
    color: #fafafa;
    font-family: inherit;
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .01em;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
  }

  .holiday-toggle:hover {
    transform: translateX(-50%) translateY(-1px);
    background: rgba(255,255,255,.1);
  }

  .holiday-toggle:active {
    transform: translateX(-50%) scale(.98);
  }

  .holiday-toggle:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  .holiday-ico {
    font-size: 1.05rem;
    line-height: 1;
    display: inline-block;
  }

  body.holiday .holiday-toggle {
    background: linear-gradient(100deg, #9d1c2c, #1f7a45);
    border-color: rgba(255, 224, 138, .6);
    box-shadow: 0 0 0 1px rgba(255,224,138,.25), 0 10px 28px rgba(227, 40, 70, .35);
  }

  body.holiday .holiday-ico { animation: wiggle .9s ease-in-out infinite; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .holiday-toast {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    left: 50%;
    z-index: 8;
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(20, 8, 12, .78);
    color: #ffe08a;
    font-weight: 700;
    font-size: .86rem;
    letter-spacing: .03em;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity .35s ease, transform .35s ease;
    text-align: center;
    max-width: min(92vw, 420px);
  }

  .holiday-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .xmas-lights {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-14px);
    transition: opacity .45s ease, transform .5s ease;
  }

  body.holiday .xmas-lights {
    opacity: 1;
    transform: none;
  }

  .xmas-wire {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .bulbs {
    position: absolute;
    left: 0;
    right: 0;
    top: 16px;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
  }

  .bulb {
    display: block;
    width: 10px;
    height: 14px;
    border-radius: 6px 6px 9px 9px;
    box-shadow: 0 0 10px currentColor, 0 8px 10px rgba(0,0,0,.15);
    animation: bulb 1.5s ease-in-out infinite;
  }

  .bulb:nth-child(5n+1) { color: #ff4d4d; background: #ff4d4d; animation-delay: 0s; }
  .bulb:nth-child(5n+2) { color: #ffd24d; background: #ffd24d; animation-delay: .25s; }
  .bulb:nth-child(5n+3) { color: #3dcc7a; background: #3dcc7a; animation-delay: .5s; }
  .bulb:nth-child(5n+4) { color: #7fd4ff; background: #7fd4ff; animation-delay: .75s; }
  .bulb:nth-child(5n) { color: #ff8ad4; background: #ff8ad4; animation-delay: 1s; }

  @keyframes bulb {
    0%, 100% { filter: brightness(1.15); opacity: 1; }
    50% { filter: brightness(.45); opacity: .55; }
  }

  .snowbank {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 96px;
    z-index: 2;
    pointer-events: none;
    display: block;
    transform: translateY(105%);
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
  }

  body.holiday .snowbank { transform: translateY(0); }

  .corner-deco {
    position: fixed;
    z-index: 5;
    bottom: 8px;
    font-size: 46px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.35));
    transform: translateY(140%);
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }

  .corner-deco.tree { left: 14px; }
  .corner-deco.star {
    right: 16px;
    font-size: 34px;
    bottom: 18px;
  }

  body.holiday .corner-deco { transform: translateY(0); }
  body.holiday .corner-deco.star { animation: spin-slow 8s linear infinite; }

  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }

  body.holiday .glow {
    background:
      radial-gradient(38vmax 38vmax at 18% 18%, rgba(120, 190, 255, 0.2), transparent 62%),
      radial-gradient(34vmax 34vmax at 82% 78%, rgba(255, 70, 90, 0.14), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 40%, rgba(255, 210, 90, 0.12), transparent 68%);
  }

  body.holiday .name {
    color: #ffe08a;
    text-shadow:
      0 0 18px rgba(255, 214, 90, .45),
      0 2px 10px rgba(0,0,0,.8);
  }

  .santa-fly {
    position: fixed;
    left: 0;
    top: 14vh;
    z-index: 5;
    width: min(680px, 88vw);
    pointer-events: none;
    will-change: transform;
  }

  .santa-fly[hidden] { display: none !important; }

  .santa-bob {
    position: relative;
    animation: santaBob .85s ease-in-out infinite;
  }

  @keyframes santaBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes santaCross {
    from { transform: translate3d(-115%, 0, 0); }
    to { transform: translate3d(125vw, 0, 0); }
  }

  .santa-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 12px 10px rgba(0,0,0,.35));
  }

  .deer-bob {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: deerBob .42s ease-in-out infinite;
  }

  .d2 .deer-bob { animation-delay: -.14s; }
  .d3 .deer-bob { animation-delay: -.28s; }

  @keyframes deerBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .leg {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg .32s ease-in-out infinite;
  }

  .leg.alt { animation-delay: -.16s; }
  .d2 .leg { animation-duration: .36s; }
  .d3 .leg { animation-duration: .3s; }

  @keyframes leg {
    0%, 100% { transform: rotate(16deg); }
    50% { transform: rotate(-16deg); }
  }

  .wave {
    transform-box: fill-box;
    transform-origin: 0% 70%;
    animation: wave .55s ease-in-out infinite;
  }

  @keyframes wave {
    0%, 100% { transform: rotate(12deg); }
    50% { transform: rotate(-26deg); }
  }

  .nose-glow {
    fill: #ff2b2b;
    animation: nosePulse .7s ease-in-out infinite;
  }

  @keyframes nosePulse {
    0%, 100% { filter: drop-shadow(0 0 2px #ff2b2b); }
    50% { filter: drop-shadow(0 0 7px #ffd0d0); }
  }

  .scarf { animation: scarf .7s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0%; }
  @keyframes scarf {
    0%, 100% { transform: rotate(6deg); }
    50% { transform: rotate(-10deg); }
  }

  .spark-trail {
    position: absolute;
    left: -78px;
    top: 58%;
    display: flex;
    gap: 9px;
    align-items: center;
  }

  .spark-trail i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffe08a;
    box-shadow: 0 0 8px #ffd700;
    animation: tw .7s ease-in-out infinite;
  }

  .spark-trail i:nth-child(odd) { background: #fff; animation-delay: .2s; }
  .spark-trail i:nth-child(3n) { width: 4px; height: 4px; animation-delay: .4s; }

  @keyframes tw {
    50% { opacity: .15; transform: scale(.35); }
  }

  .hoho {
    position: absolute;
    left: 12%;
    top: -2px;
    background: #fff;
    color: #9d1c2c;
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(0,0,0,.25);
    opacity: 0;
    transform: translateY(6px) scale(.92);
    transition: opacity .25s ease, transform .25s ease;
  }

  .santa-fly.cheering .hoho {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .gift {
    position: fixed;
    top: -8vh;
    z-index: 5;
    pointer-events: none;
    animation-name: giftFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.35));
  }

  @keyframes giftFall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(260deg); }
  }

  @keyframes rocketFly {
    0%   { transform: translate(0, 0); opacity: 1; }
    75%  { opacity: 1; }
    100% { transform: translate(var(--dx, 50vw), -100vh); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-link { transition: none !important; }
    .btn { transition: none !important; }
    .launch-button { transition: none !important; }
    .bulb, .deer-bob, .leg, .wave, .nose-glow, .scarf, .spark-trail i,
    .holiday-ico, .corner-deco, .santa-bob {
      animation: none !important;
    }
    body.holiday .santa-fly.parked {
      top: auto;
      bottom: 78px;
      right: 8px;
      left: auto;
      width: min(300px, 72vw);
      animation: none !important;
      transform: none !important;
    }
  }

  @media (max-width: 700px) {
    .kicker { font-size: .64rem; }
    .nav-link { font-size: .92rem; padding: 10px 13px; }
    .holiday-toggle { font-size: .82rem; padding: 8px 12px 8px 8px; }
    .holiday-toast { font-size: .78rem; }
    .corner-deco { font-size: 36px; }
    .corner-deco.star { font-size: 26px; }
  }
  </style>
</head>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
      <h3 class="modal-title" id="contactTitle">Get in touch</h3>
      <p style="opacity:.8;margin:0 0 14px;">Choose how you'd like to reach me.</p>
      <div class="modal-actions">
        <button class="btn primary" id="mailOpenBtn" type="button">Open mail app</button>
        <button class="btn" id="copyBtn" type="button">Copy email</button>

  <script>
/* ========================= CONTACT ========================= */
const contactBtn = document.querySelector('.contact-btn');
const modal = document.getElementById('contactModal');
const mailOpenBtn = document.getElementById('mailOpenBtn');
const copyBtn = document.getElementById('copyBtn');
const closeModalBtn = document.getElementById('closeModalBtn');

function buildEmail() {
  return ['sambrit','adhikari'].join('') + String.fromCharCode(64) + ['gmail','com'].join('.');
}

function closeModal() { modal.hidden = true; }

contactBtn.addEventListener('click', () => { modal.hidden = false; });
closeModalBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

mailOpenBtn.addEventListener('click', () => {
  window.location.href = 'mailto:' + buildEmail();
  closeModal();
});

copyBtn.addEventListener('click', async () => {
  const email = buildEmail();
  try {
    await navigator.clipboard.writeText(email);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy email'; }, 1200);
  } catch {
    copyBtn.textContent = email;
  }
});

/* ========================= LAUNCH BUTTON ========================= */
const launchBtn = document.querySelector('.launch-button');
launchBtn.addEventListener('click', () => {
  const rocket = document.createElement('div');
  rocket.className = 'rocket';
  rocket.textContent = '🚀';
  const rect = launchBtn.getBoundingClientRect();
  rocket.style.left = (rect.left + rect.width / 2 - 16) + 'px';
  rocket.style.top = (rect.top - 10) + 'px';
  const dir = Math.random() < 0.25 ? -1 : 1;
  rocket.style.setProperty('--dx', (dir * (40 + Math.random() * 25)) + 'vw');
  document.body.appendChild(rocket);
  setTimeout(() => rocket.remove(), 3300);
});

/* ========================= HOLIDAY MODE ========================= */
const holidayBtn = document.getElementById('holidayToggle');
const holidayLabel = holidayBtn.querySelector('.holiday-label');
const holidayIcon = holidayBtn.querySelector('.holiday-ico');
const holidayToast = document.getElementById('holidayToast');
const santaFly = document.getElementById('santaFly');
const snowCanvas = document.getElementById('snow');
const sctx = snowCanvas.getContext('2d', { alpha: true });

let holidayOn = false;
let flakes = [];
let dust = [];
let wind = 0;
let windTarget = 0;
let nextWindAt = 0;
let santaTimer = 0;
let hoTimer = 0;
let hoTimerOff = 0;
let giftTimer = 0;
let toastTimer = 0;
let snowWasOn = false;

const GIFT_EMOJI = ['🎁', '⭐', '🔔', '🍬', '🧦', '❄️'];

function setHoliday(on, opts) {
  const sound = !!(opts && opts.sound);
  const announce = !!(opts && opts.announce);
  holidayOn = on;
  document.body.classList.toggle('holiday', on);
  holidayBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  holidayLabel.textContent = on ? 'Holiday mode on' : 'Holiday mode';
  holidayIcon.textContent = on ? '❄️' : '🎄';
  holidayBtn.setAttribute('aria-label', on ? 'Turn holiday mode off' : 'Turn holiday mode on');
  try { localStorage.setItem('holiday-mode', on ? '1' : '0'); } catch (e) {}
  if (on) {
    startHoliday();
    if (announce) showToast('Happy holidays — the sleigh is out');
    if (sound) {
      burstFromButton();
      playJingle();
    }
  } else {
    stopHolidayEffects();
    if (announce) showToast('See you next holiday');
  }
}

function showToast(text) {
  holidayToast.textContent = text;
  holidayToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => holidayToast.classList.remove('show'), 2600);
}

function startHoliday() {
  stopHolidayEffects();
  if (reduceMotion) {
    santaFly.hidden = false;
    santaFly.classList.add('parked');
    return;
  }
  santaFly.classList.remove('parked');
  queueSanta(650);
  queueGift(1100);
}

function stopHolidayEffects() {
  clearTimeout(santaTimer);
  clearTimeout(hoTimer);
  clearTimeout(hoTimerOff);
  clearTimeout(giftTimer);
  santaFly.hidden = true;
  santaFly.classList.remove('cheering', 'parked');
  santaFly.style.animation = 'none';
  document.querySelectorAll('.gift').forEach((g) => g.remove());
  dust = [];
}

function queueSanta(delay) {
  clearTimeout(santaTimer);
  santaTimer = setTimeout(launchSanta, delay);
}

function launchSanta() {
  if (!holidayOn || reduceMotion) return;
  const lowPass = Math.random() < 0.18;
  const duration = lowPass ? rand(8, 10) : rand(12, 17);
  santaFly.hidden = false;
  santaFly.classList.remove('cheering');
  santaFly.style.top = (lowPass ? rand(24, 34) : rand(7, 18)) + 'vh';
  santaFly.style.animation = 'none';
  void santaFly.offsetWidth;
  santaFly.style.animation = 'santaCross ' + duration + 's linear forwards';
  hoTimer = setTimeout(() => santaFly.classList.add('cheering'), duration * 320);
  hoTimerOff = setTimeout(() => santaFly.classList.remove('cheering'), duration * 680);
  santaTimer = setTimeout(() => {
    santaFly.hidden = true;
    santaFly.classList.remove('cheering');
    if (holidayOn) queueSanta(rand(2200, 5200));
  }, duration * 1000 + 40);
}

function queueGift(delay) {
  clearTimeout(giftTimer);
  giftTimer = setTimeout(() => {
    if (!holidayOn || reduceMotion) return;
    if (document.querySelectorAll('.gift').length < 5) spawnGift();
    queueGift(rand(1400, 2800));
  }, delay);
}

function spawnGift() {
  const el = document.createElement('div');
  el.className = 'gift';
  el.textContent = GIFT_EMOJI[(Math.random() * GIFT_EMOJI.length) | 0];
  el.style.left = rand(4, 92) + 'vw';
  el.style.fontSize = rand(18, 34) + 'px';
  el.style.animationDuration = rand(7, 12) + 's';
  el.style.setProperty('--drift', rand(-70, 90) + 'px');
  document.body.appendChild(el);
  const life = parseFloat(el.style.animationDuration) * 1000 + 200;
  setTimeout(() => el.remove(), life);
}

function burstFromButton() {
  const rect = holidayBtn.getBoundingClientRect();
  const x = (rect.left + rect.width / 2) * dpr;
  const y = rect.bottom * dpr;
  for (let i = 0; i < 28; i++) {
    const ang = rand(-Math.PI, 0);
    const spd = rand(0.8, 3.2);
    dust.push({
      x: x,
      y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd * 0.65,
      life: 1,
      r: rand(1.1, 2.6),
      gold: Math.random() < 0.6
    });
  }
}

function playJingle() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  try {
    const audio = new AudioCtx();
    const notes = [659.25, 659.25, 659.25, 783.99, 659.25, 523.25];
    notes.forEach((freq, i) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audio.destination);
      const t = audio.currentTime + i * 0.14;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.start(t);
      osc.stop(t + 0.24);
    });
    setTimeout(() => audio.close(), 1800);
  } catch (e) {}
}

function makeFlake(anywhere) {
  const roll = Math.random();
  return {
    x: Math.random() * Math.max(snowCanvas.width, 1),
    y: anywhere ? Math.random() * Math.max(snowCanvas.height, 1) : -rand(4, 40),
    r: rand(0.6, 2.7),
    vy: rand(0.28, 0.95),
    vx: rand(-0.18, 0.18),
    wobble: rand(0, Math.PI * 2),
    wobbleSpeed: rand(0.01, 0.025),
    o: rand(0.35, 0.95),
    kind: roll > 0.86 ? 'star' : 'dot'
  };
}

function initSnow() {
  const count = Math.min(200, Math.floor((innerWidth * innerHeight) / 13000));
  flakes = [];
  for (let i = 0; i < count; i++) flakes.push(makeFlake(true));
}

function drawSnowflake(x, y, r, alpha) {
  sctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
  sctx.lineWidth = Math.max(1, dpr * 0.7);
  sctx.beginPath();
  for (let a = 0; a < 6; a++) {
    const ang = a * Math.PI / 3;
    sctx.moveTo(x, y);
    sctx.lineTo(x + Math.cos(ang) * r * 3.1, y + Math.sin(ang) * r * 3.1);
  }
  sctx.stroke();
}

holidayBtn.addEventListener('click', () => {
  const next = !holidayOn;
  setHoliday(next, { sound: next, announce: true });
});

/* ========================= STARFIELD ========================= */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d', { alpha: true });
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let dpr = 1;
let stars = [];
let shootingStar = null;
let nextShootingStarAt = 0;

const pointer = { x: 0.5, y: 0.5 };
const smooth = { x: 0.5, y: 0.5 };

addEventListener('mousemove', (e) => {
  pointer.x = e.clientX / innerWidth;
  pointer.y = e.clientY / innerHeight;
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (!e.touches.length) return;
  pointer.x = e.touches[0].clientX / innerWidth;
  pointer.y = e.touches[0].clientY / innerHeight;
}, { passive: true });

function rand(min, max) { return Math.random() * (max - min) + min; }

function initStars() {
  const count = Math.floor((innerWidth * innerHeight) / 2800);
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: rand(0.3, 1.4),
      o: rand(0.25, 0.85),
      depth: rand(0.15, 1.0),
      phase: rand(0, Math.PI * 2),
      speed: rand(0.0003, 0.0008)
    });
  }
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  snowCanvas.width = canvas.width;
  snowCanvas.height = canvas.height;
  snowCanvas.style.width = '100vw';
  snowCanvas.style.height = '100vh';
  snowWasOn = false;
  initStars();
  initSnow();
}

addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', resize, { passive: true });

function createShootingStar() {
  const fromLeft = Math.random() < 0.5;
  return {
    x: fromLeft ? -0.1 * canvas.width : 1.1 * canvas.width,
    y: rand(0.08, 0.65) * canvas.height,
    vx: (fromLeft ? 1 : -1) * rand(0.5, 0.9) * dpr,
    vy: rand(-0.08, 0.14) * dpr,
    length: rand(100, 190) * dpr,
    width: rand(1.2, 2.2) * dpr,
    life: rand(900, 1500)
  };
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(33, now - last);
  last = now;

  const w = canvas.width;
  const h = canvas.height;

  smooth.x += (pointer.x - smooth.x) * 0.05;
  smooth.y += (pointer.y - smooth.y) * 0.05;
  const mx = smooth.x - 0.5;
  const my = smooth.y - 0.5;

  ctx.clearRect(0, 0, w, h);

  for (const s of stars) {
    const twinkle = reduceMotion ? 1 : (0.78 + 0.22 * Math.sin(s.phase + now * s.speed));
    const px = (s.x + mx * s.depth * 0.06) * w;
    const py = (s.y + my * s.depth * 0.06) * h;

    ctx.globalAlpha = s.o * twinkle;
    const festive = holidayOn && s.depth > 0.72;
    ctx.fillStyle = festive ? (s.phase > 3 ? '#ffe08a' : '#d7f6ff') : '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, s.r * dpr, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  if (!reduceMotion) {
    if (!shootingStar && now >= nextShootingStarAt) {
      shootingStar = createShootingStar();
    }

    if (shootingStar) {
      const c = shootingStar;
      c.x += c.vx * dt * 0.16;
      c.y += c.vy * dt * 0.16;
      c.life -= dt;

      const tx = c.x - c.vx * c.length;
      const ty = c.y - c.vy * c.length;
      const grad = ctx.createLinearGradient(c.x, c.y, tx, ty);
      grad.addColorStop(0, holidayOn ? 'rgba(255,224,138,0.95)' : 'rgba(255,255,255,0.90)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = c.width;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      if (c.life <= 0 || c.x < -0.2 * w || c.x > 1.2 * w) {
        shootingStar = null;
        nextShootingStarAt = now + rand(2500, 7000);
      }
    }
  }

  const sw = snowCanvas.width;
  const sh = snowCanvas.height;
  if (!holidayOn) {
    if (snowWasOn) {
      sctx.clearRect(0, 0, sw, sh);
      snowWasOn = false;
      dust = [];
    }
  } else if (!reduceMotion) {
    snowWasOn = true;
    if (now > nextWindAt) {
      windTarget = rand(-0.55, 0.55);
      nextWindAt = now + rand(2800, 7000);
    }
    wind += (windTarget - wind) * 0.012;

    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.wobble += f.wobbleSpeed * dt;
      f.y += (f.vy + f.r * 0.18) * dt * 0.07 * dpr;
      f.x += (f.vx + wind + Math.sin(f.wobble) * 0.28) * dt * 0.07 * dpr;
      if (f.y > sh + 8) {
        flakes[i] = makeFlake(false);
        continue;
      }
      if (f.x < -12) f.x = sw + 8;
      if (f.x > sw + 12) f.x = -8;
      if (f.kind === 'star') {
        drawSnowflake(f.x, f.y, f.r * dpr, f.o);
      } else {
        sctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
        sctx.beginPath();
        sctx.arc(f.x, f.y, f.r * dpr, 0, Math.PI * 2);
        sctx.fill();
      }
    }

    if (!santaFly.hidden) {
      const box = santaFly.getBoundingClientRect();
      if (Math.random() < 0.85) {
        dust.push({
          x: box.left * dpr,
          y: (box.top + box.height * 0.62) * dpr,
          vx: -rand(0.15, 1.1) * dpr,
          vy: rand(-0.25, 0.35) * dpr,
          life: 1,
          r: rand(1, 2.4),
          gold: Math.random() < 0.75
        });
      }
    }

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * dt * 0.16;
      p.y += p.vy * dt * 0.16;
      p.vy += 0.004 * dt;
      p.life -= dt / 700;
      if (p.life <= 0) {
        dust.splice(i, 1);
        continue;
      }
      sctx.globalAlpha = Math.max(0, p.life);
      sctx.fillStyle = p.gold ? '#ffe08a' : '#ffffff';
      sctx.beginPath();
      sctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
    if (dust.length > 90) dust.splice(0, dust.length - 90);
  } else if (!snowWasOn) {
    snowWasOn = true;
    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      if (f.kind === 'star') drawSnowflake(f.x, f.y, f.r * dpr, f.o);
      else {
        sctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
        sctx.beginPath();
        sctx.arc(f.x, f.y, f.r * dpr, 0, Math.PI * 2);
        sctx.fill();
      }
    }
  }

  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

try {
  if (localStorage.getItem('holiday-mode') === '1') setHoliday(true);
} catch (e) {}
  </script>
