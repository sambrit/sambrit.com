<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sambrit Adhikari</title>
  <meta name="description" content="Sambrit Adhikari, a program manager and engineer specializing in AI, machine learning, and software development."/>
  <meta name="keywords" content="Sambrit Adhikari, program manager, engineer, software development, AI, machine learning, LinkedIn, program management, product manager, technical program manager, artificial intelligence, data science"/>
  <meta name="author" content="Sambrit Adhikari"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://www.sambrit.com/"/>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">

  <style>
  :root {
    --text: #FAFAFA;
    --accent: #FFD700;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #0a0d14 0%, #0b1020 50%, #0d1428 100%);
    overflow: hidden;
    position: relative;
  }

  #bg, #snow {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    pointer-events: none;
  }

  #bg { z-index: 0; }
  #snow { z-index: 4; }

  .glow {
    position: fixed;
    inset: -10vmax;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(38vmax 38vmax at 20% 22%, rgba(71, 222, 232, 0.14), transparent 62%),
      radial-gradient(35vmax 35vmax at 80% 73%, rgba(250, 204, 21, 0.10), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 58%, rgba(244, 114, 182, 0.08), transparent 68%);
    filter: blur(9px);
  }

  .main-content {
    position: relative;
    z-index: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }

  .kicker, .name, .nav-links { position: relative; z-index: 6; }

  .kicker {
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.72rem;
    font-weight: 700;
    color: #BFFBFF;
    text-shadow: 0 2px 8px rgba(0,0,0,0.62);
  }

  /* The name stays a solid gold-family color. A seasonal tint is fine.
     Clipping the letters to a gradient made them look hollow, so the
     color is painted on the text itself. Flyers sit under this text. */
  .name {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    margin: 10px 0 0;
    color: var(--accent);
    letter-spacing: .6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  .nav-links {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-link {
    text-decoration: none;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,.35);
    padding: 10px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    backdrop-filter: blur(6px);
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .nav-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(0,0,0,.35);
    background: rgba(255,255,255,.08);
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }

  .modal[hidden] {
    display: none;
  }

  .modal-card {
    background: rgba(15,15,20,0.9);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    width: min(92vw, 380px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal-title {
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: 0.3px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform .15s ease, background .15s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.12);
  }

  .btn.primary {
    background: linear-gradient(90deg, #facc15, #22d3ee);
    color: #0a0a0a;
    font-weight: 800;
    border: none;
  }

  .launch-button {
    position: fixed;
    z-index: 8;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom));
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #0a0a0a;
    background: var(--accent);
    border: none;
    cursor: pointer;
    user-select: none;
    transition: transform .2s ease, filter .2s ease;
    touch-action: manipulation;
  }

  .launch-button:hover {
    transform: translateX(-50%) translateY(-2px);
    filter: brightness(1.08);
  }

  .launch-button:active {
    transform: translateX(-50%) scale(0.97);
  }

  .name { cursor: pointer; }

  .wish, .sparkle {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    line-height: 1;
  }

  .wish {
    font-size: 14px;
    color: #fff;
    animation: wish 1.5s ease-out forwards;
  }

  .sparkle {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffe08a;
    box-shadow: 0 0 8px #ffd700;
    animation: sparkle 900ms ease-out forwards;
  }

  @keyframes wish {
    0% { transform: translate(-50%, -40%) scale(.7); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(-50%, -64px) scale(1); opacity: 0; }
  }

  @keyframes sparkle {
    0% { transform: translate(0, 0) scale(.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(1); opacity: 0; }
  }

  .rocket {
    position: fixed;
    font-size: 2rem;
    z-index: 9;
    pointer-events: none;
    will-change: transform;
  }

  /* Top control. This is a switch, not a status sentence, because
     "Holiday mode on" did not read as something you can turn off.
     The season name is the only label. The track and knob show the
     state: the knob moves right only while aria-pressed is true.
     Script keeps the control visible after the scene is turned off,
     when data-mode is gone, so the knob cannot key off the scene. */
  .holiday-toggle {
    position: fixed;
    z-index: 8;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(8,10,16,.72);
    color: #fafafa;
    font-family: inherit;
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    transition: transform .2s ease, background .2s ease;
  }

  .holiday-toggle:hover {
    transform: translateX(-50%) translateY(-1px);
    background: rgba(255,255,255,.1);
  }

  .holiday-toggle:active {
    transform: translateX(-50%) scale(.98);
  }

  .holiday-toggle:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  .switch {
    position: relative;
    flex: none;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: #3a4150;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
  }

  .switch-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    transition: transform .18s ease;
  }

  .holiday-toggle[aria-pressed="true"] .switch {
    background: #3dcc7a;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  }

  .holiday-toggle[aria-pressed="true"] .switch-knob {
    transform: translateX(18px);
  }

  .holiday-toast {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    left: 50%;
    z-index: 8;
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(20, 8, 12, .78);
    color: #ffe08a;
    font-weight: 700;
    font-size: .86rem;
    letter-spacing: .03em;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity .35s ease, transform .35s ease;
    text-align: center;
    max-width: min(92vw, 420px);
  }

  .holiday-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* One string of lights for every scene. Each mode only recolors
     the bulbs, so Halloween, July 4, Valentine, and Spring share
     the same wire instead of a second decoration. */
  .xmas-lights {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-14px);
    transition: opacity .45s ease, transform .5s ease;
  }

  html[data-mode="holiday"] .xmas-lights,
  html[data-mode="halloween"] .xmas-lights,
  html[data-mode="july4"] .xmas-lights,
  html[data-mode="patrick"] .xmas-lights,
  html[data-mode="valentine"] .xmas-lights,
  html[data-mode="spring"] .xmas-lights {
    opacity: 1;
    transform: none;
  }

  .xmas-wire {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .bulbs {
    position: absolute;
    left: 0;
    right: 0;
    top: 16px;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
  }

  .bulb {
    display: block;
    width: 10px;
    height: 14px;
    border-radius: 6px 6px 9px 9px;
    box-shadow: 0 0 10px currentColor, 0 8px 10px rgba(0,0,0,.15);
    animation: bulb 1.5s ease-in-out infinite;
  }

  .bulb:nth-child(5n+1) { color: #ff4d4d; background: #ff4d4d; animation-delay: 0s; }
  .bulb:nth-child(5n+2) { color: #ffd24d; background: #ffd24d; animation-delay: .25s; }
  .bulb:nth-child(5n+3) { color: #3dcc7a; background: #3dcc7a; animation-delay: .5s; }
  .bulb:nth-child(5n+4) { color: #7fd4ff; background: #7fd4ff; animation-delay: .75s; }
  .bulb:nth-child(5n) { color: #ff8ad4; background: #ff8ad4; animation-delay: 1s; }

  @keyframes bulb {
    0%, 100% { filter: brightness(1.15); opacity: 1; }
    50% { filter: brightness(.45); opacity: .55; }
  }

  .snowbank {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 96px;
    z-index: 2;
    pointer-events: none;
    display: block;
    transform: translateY(105%);
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
  }

  html[data-mode="holiday"] .snowbank { transform: translateY(0); }

  .corner-deco {
    position: fixed;
    z-index: 5;
    bottom: 8px;
    font-size: 46px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.35));
    transform: translateY(140%);
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }

  .corner-deco.tree,
  .corner-deco.pumpkin:not(.right),
  .corner-deco.flag:not(.right),
  .corner-deco.shamrock:not(.right),
  .corner-deco.heart:not(.right),
  .corner-deco.blossom:not(.right) { left: 14px; }

  .holiday-toggle[hidden] { display: none !important; }
  .corner-deco.right {
    right: 132px;
    font-size: 34px;
    bottom: 18px;
  }

  html[data-mode="holiday"] .corner-deco.tree,
  html[data-mode="holiday"] .corner-deco.star { transform: translateY(0); }
  html[data-mode="holiday"] .corner-deco.star { animation: spin-slow 8s linear infinite; }
  html[data-mode="halloween"] .corner-deco.pumpkin { transform: translateY(0); }
  html[data-mode="july4"] .corner-deco.flag { transform: translateY(0); }
  html[data-mode="patrick"] .corner-deco.shamrock { transform: translateY(0); }
  html[data-mode="valentine"] .corner-deco.heart { transform: translateY(0); }
  html[data-mode="spring"] .corner-deco.blossom { transform: translateY(0); }

  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }

  html[data-mode="holiday"] .glow {
    background:
      radial-gradient(38vmax 38vmax at 18% 18%, rgba(120, 190, 255, 0.2), transparent 62%),
      radial-gradient(34vmax 34vmax at 82% 78%, rgba(255, 70, 90, 0.14), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 40%, rgba(255, 210, 90, 0.12), transparent 68%);
  }

  html[data-mode="holiday"] .name {
    color: #ffe08a;
    text-shadow:
      0 0 18px rgba(255, 214, 90, .45),
      0 2px 10px rgba(0,0,0,.8);
  }

  /* Flyers cross the upper sky under the name. Text is z-index 6
     and these are 5, so a pass never covers the title. The sleigh
     is wide on purpose. The witch and the leprechaun override that
     width so their drawings are not stretched to the sleigh. */
  .santa-fly {
    position: fixed;
    left: 0;
    top: 14vh;
    z-index: 5;
    width: min(680px, 88vw);
    pointer-events: none;
    will-change: transform;
  }

  .santa-fly[hidden] { display: none !important; }

  .santa-bob {
    position: relative;
    animation: santaBob .85s ease-in-out infinite;
  }

  @keyframes santaBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes santaCross {
    from { transform: translate3d(-115%, 0, 0); }
    to { transform: translate3d(125vw, 0, 0); }
  }

  .santa-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 12px 10px rgba(0,0,0,.35));
  }

  .deer-bob {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: deerBob .42s ease-in-out infinite;
  }

  .d2 .deer-bob { animation-delay: -.14s; }
  .d3 .deer-bob { animation-delay: -.28s; }

  @keyframes deerBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .leg {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg .32s ease-in-out infinite;
  }

  .leg.alt { animation-delay: -.16s; }
  .d2 .leg { animation-duration: .36s; }
  .d3 .leg { animation-duration: .3s; }

  @keyframes leg {
    0%, 100% { transform: rotate(16deg); }
    50% { transform: rotate(-16deg); }
  }

  .wave {
    transform-box: fill-box;
    transform-origin: 0% 70%;
    animation: wave .55s ease-in-out infinite;
  }

  @keyframes wave {
    0%, 100% { transform: rotate(12deg); }
    50% { transform: rotate(-26deg); }
  }

  .nose-glow {
    fill: #ff2b2b;
    animation: nosePulse .7s ease-in-out infinite;
  }

  @keyframes nosePulse {
    0%, 100% { filter: drop-shadow(0 0 2px #ff2b2b); }
    50% { filter: drop-shadow(0 0 7px #ffd0d0); }
  }

  .scarf { animation: scarf .7s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0%; }
  @keyframes scarf {
    0%, 100% { transform: rotate(6deg); }
    50% { transform: rotate(-10deg); }
  }

  .spark-trail {
    position: absolute;
    left: -78px;
    top: 58%;
    display: flex;
    gap: 9px;
    align-items: center;
  }

  .spark-trail i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffe08a;
    box-shadow: 0 0 8px #ffd700;
    animation: tw .7s ease-in-out infinite;
  }

  .spark-trail i:nth-child(odd) { background: #fff; animation-delay: .2s; }
  .spark-trail i:nth-child(3n) { width: 4px; height: 4px; animation-delay: .4s; }

  @keyframes tw {
    50% { opacity: .15; transform: scale(.35); }
  }

  .hoho {
    position: absolute;
    left: 12%;
    top: -2px;
    background: #fff;
    color: #9d1c2c;
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(0,0,0,.25);
    opacity: 0;
    transform: translateY(6px) scale(.92);
    transition: opacity .25s ease, transform .25s ease;
  }

  .santa-fly.cheering .hoho {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .gift {
    position: fixed;
    top: -8vh;
    z-index: 5;
    pointer-events: none;
    animation-name: giftFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.35));
  }

  @keyframes giftFall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--drift), 115vh, 0) rotate(260deg); }
  }


  html[data-mode="halloween"] .bulb:nth-child(5n+1) { color: #ff6a00; background: #ff6a00; }
  html[data-mode="halloween"] .bulb:nth-child(5n+2) { color: #b388ff; background: #b388ff; }
  html[data-mode="halloween"] .bulb:nth-child(5n+3) { color: #ffd24d; background: #ffd24d; }
  html[data-mode="halloween"] .bulb:nth-child(5n+4) { color: #7c4dff; background: #7c4dff; }
  html[data-mode="halloween"] .bulb:nth-child(5n) { color: #ff8a50; background: #ff8a50; }

  html[data-mode="july4"] .bulb:nth-child(3n+1) { color: #ff4d4d; background: #ff4d4d; }
  html[data-mode="july4"] .bulb:nth-child(3n+2) { color: #f7f7f7; background: #f7f7f7; }
  html[data-mode="july4"] .bulb:nth-child(3n) { color: #6eb6ff; background: #6eb6ff; }

  html[data-mode="patrick"] .bulb:nth-child(5n+1) { color: #3dcc7a; background: #3dcc7a; }
  html[data-mode="patrick"] .bulb:nth-child(5n+2) { color: #ffe08a; background: #ffe08a; }
  html[data-mode="patrick"] .bulb:nth-child(5n+3) { color: #1faa5a; background: #1faa5a; }
  html[data-mode="patrick"] .bulb:nth-child(5n+4) { color: #d6ff9a; background: #d6ff9a; }
  html[data-mode="patrick"] .bulb:nth-child(5n) { color: #f2c14e; background: #f2c14e; }

  html[data-mode="valentine"] .bulb:nth-child(5n+1) { color: #ff4d6a; background: #ff4d6a; }
  html[data-mode="valentine"] .bulb:nth-child(5n+2) { color: #ff8ab0; background: #ff8ab0; }
  html[data-mode="valentine"] .bulb:nth-child(5n+3) { color: #e23b4a; background: #e23b4a; }
  html[data-mode="valentine"] .bulb:nth-child(5n+4) { color: #ffd0dc; background: #ffd0dc; }
  html[data-mode="valentine"] .bulb:nth-child(5n) { color: #ff5c8a; background: #ff5c8a; }

  html[data-mode="spring"] .bulb:nth-child(5n+1) { color: #ffb7c5; background: #ffb7c5; }
  html[data-mode="spring"] .bulb:nth-child(5n+2) { color: #fff1c9; background: #fff1c9; }
  html[data-mode="spring"] .bulb:nth-child(5n+3) { color: #c8f0c0; background: #c8f0c0; }
  html[data-mode="spring"] .bulb:nth-child(5n+4) { color: #f3c6e0; background: #f3c6e0; }
  html[data-mode="spring"] .bulb:nth-child(5n) { color: #ffe08a; background: #ffe08a; }

  html[data-mode="halloween"] .glow {
    background:
      radial-gradient(38vmax 38vmax at 18% 18%, rgba(255, 120, 20, 0.18), transparent 62%),
      radial-gradient(34vmax 34vmax at 82% 70%, rgba(120, 40, 200, 0.18), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 40%, rgba(255, 180, 40, 0.08), transparent 68%);
  }
  html[data-mode="july4"] .glow {
    background:
      radial-gradient(36vmax 36vmax at 20% 80%, rgba(220, 40, 40, 0.16), transparent 62%),
      radial-gradient(36vmax 36vmax at 80% 80%, rgba(40, 120, 255, 0.18), transparent 62%),
      radial-gradient(30vmax 30vmax at 50% 20%, rgba(255, 255, 255, 0.08), transparent 68%);
  }
  html[data-mode="patrick"] .glow {
    background:
      radial-gradient(38vmax 38vmax at 18% 22%, rgba(40, 180, 70, 0.2), transparent 62%),
      radial-gradient(34vmax 34vmax at 80% 70%, rgba(255, 210, 60, 0.14), transparent 66%);
  }
  html[data-mode="valentine"] .glow {
    background:
      radial-gradient(36vmax 36vmax at 18% 24%, rgba(255, 90, 130, 0.16), transparent 62%),
      radial-gradient(34vmax 34vmax at 80% 72%, rgba(220, 40, 70, 0.12), transparent 66%);
  }
  html[data-mode="spring"] .glow {
    background:
      radial-gradient(36vmax 36vmax at 20% 22%, rgba(255, 190, 210, 0.16), transparent 62%),
      radial-gradient(34vmax 34vmax at 78% 74%, rgba(180, 230, 170, 0.12), transparent 66%);
  }

  html[data-mode="halloween"] .name {
    color: #ffb15a;
    text-shadow: 0 0 18px rgba(255, 90, 20, .45), 0 2px 10px rgba(0,0,0,.8);
  }
  html[data-mode="july4"] .name {
    color: #fffaf4;
    text-shadow: 0 0 14px rgba(80, 160, 255, .55), 0 0 2px rgba(220, 40, 40, .85), 0 2px 10px rgba(0,0,0,.8);
  }
  html[data-mode="patrick"] .name {
    color: #d6ffb0;
    text-shadow: 0 0 18px rgba(40, 180, 70, .5), 0 2px 10px rgba(0,0,0,.8);
  }
  html[data-mode="valentine"] .name {
    color: #ffd39a;
    text-shadow: 0 0 18px rgba(255, 140, 160, .35), 0 2px 10px rgba(0,0,0,.8);
  }
  html[data-mode="spring"] .name {
    color: #ffe7a3;
    text-shadow: 0 0 18px rgba(255, 200, 210, .35), 0 2px 10px rgba(0,0,0,.8);
  }

  .moon, .fog, .rainbow { pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  .moon {
    position: fixed;
    top: 14vh;
    right: 7vw;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    z-index: 1;
    background: radial-gradient(circle at 35% 35%, #fff8dc, #f0d78c 58%, #c9a84a);
    box-shadow: 0 0 32px rgba(255, 230, 150, .4);
  }
  .fog {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 140px;
    z-index: 2;
    background: linear-gradient(to top, rgba(40, 16, 60, .72), rgba(40, 16, 60, 0));
  }
  .rainbow {
    position: fixed;
    left: 8vw; right: 8vw; top: 36px;
    height: 90px;
    z-index: 1;
    border-radius: 50% 50% 0 0;
    border-top: 7px solid rgba(255, 70, 70, .8);
    box-shadow:
      0 -7px 0 rgba(255, 160, 40, .75),
      0 -14px 0 rgba(255, 220, 60, .7),
      0 -21px 0 rgba(70, 200, 90, .7),
      0 -28px 0 rgba(70, 140, 255, .7);
  }
  html[data-mode="halloween"] .moon,
  html[data-mode="halloween"] .fog,
  html[data-mode="patrick"] .rainbow { opacity: 1; }

  .ghosts {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
  }
  html[data-mode="halloween"] .ghosts { opacity: 1; }
  .ghosts span {
    position: absolute;
    font-size: 30px;
    animation: ghostFloat 8s ease-in-out infinite;
  }
  .ghosts span:nth-child(1) { left: 60%; top: 15%; animation-delay: -2s; }
  .ghosts span:nth-child(2) { left: 84%; top: 24%; animation-delay: -5s; font-size: 22px; }
  @keyframes ghostFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(28px); }
  }

  .bat-flight { font-size: 34px; letter-spacing: .35em; width: auto; }
  #witchFly, #lepFly { width: min(280px, 52vw); }
  #springFly { width: min(150px, 36vw); }
  #witchFly .hoho { left: 44%; top: 2px; }

  .wing {
    transform-box: fill-box;
    animation: wingFlap .9s ease-in-out infinite;
  }
  .wing.back { transform-origin: 92% 55%; }
  .wing.fore { transform-origin: 8% 55%; }

  @keyframes wingFlap {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(.62); }
  }

  /* Bottom control. It is a separate button because the top switch
     only turns the current scene on or off. This one advances.
     The visible word is always "Next", beside the icon of the scene
     you will land on, so the action is obvious on a phone without
     crowding the centered Launch button. */
  .mode-switch {
    position: fixed;
    z-index: 8;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 12px 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(8,10,16,.72);
    color: #fafafa;
    font-family: inherit;
    font-weight: 700;
    font-size: .82rem;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  .mode-switch:hover { background: rgba(255,255,255,.1); }
  .mode-switch:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Reduced motion keeps the scenes and drops the travel. Bulbs,
     wings, and the switch knob stop moving, and a flyer parks in
     view instead of crossing the sky. */
  @media (prefers-reduced-motion: reduce) {
    .nav-link { transition: none !important; }
    .btn { transition: none !important; }
    .launch-button, .wish, .sparkle { transition: none !important; animation: none !important; }
    .bulb, .deer-bob, .leg, .wave, .nose-glow, .scarf, .spark-trail i,
    .corner-deco, .santa-bob, .ghosts span, .wing, .switch-knob {
      animation: none !important;
    }
    .switch-knob { transition: none !important; }
    html[data-mode="holiday"] .santa-fly.parked {
      top: auto;
      bottom: 78px;
      right: 8px;
      left: auto;
      width: min(300px, 72vw);
      animation: none !important;
      transform: none !important;
    }
    html[data-mode="halloween"] #witchFly.parked,
    html[data-mode="patrick"] #lepFly.parked,
    html[data-mode="spring"] #springFly.parked {
      top: 11vh;
      left: 5vw;
      right: auto;
      animation: none !important;
      transform: none !important;
    }
  }

  @media (max-width: 700px) {
    .kicker { font-size: .64rem; }
    .nav-link { font-size: .92rem; padding: 10px 13px; }
    .holiday-toggle { font-size: .82rem; padding: 8px 12px 8px 8px; }
    .holiday-toast { font-size: .78rem; max-width: 88vw; }
    .corner-deco { font-size: 32px; }
    .corner-deco.right {
      font-size: 22px;
      right: 12px;
      bottom: 78px;
      transform: translateY(150px);
    }
    .mode-switch {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      justify-content: center;
      right: 10px;
      bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .launch-button {
      bottom: calc(16px + env(safe-area-inset-bottom));
      padding: 12px 20px;
    }
    .rocket { font-size: 1.6rem; }
  }
  </style>
</head>

  <script>
/* ========================= CONTACT ========================= */
const contactBtn = document.querySelector('.contact-btn');

function buildEmail() {

/* ========================= LAUNCH BUTTON =========================
   One rocket, then a small fan if you tap again quickly, then it rests.
   The path bends on purpose. A straight climb read as a sticker
   sliding upward. A midpoint leans the rocket sideways, then it
   leaves through the top, and the nose rotates to follow that arc.
   The rocket emoji points up-right, so the tilt adds 45 degrees.
*/
const launchBtn = document.querySelector('.launch-button');
let launchStreak = 0;
let launchReset = 0;

function noseTilt(vx, vy) {
  return Math.atan2(vy, vx) * 180 / Math.PI + 45;
}

function spawnRocket(leanVw) {
  const rocket = document.createElement('div');
  rocket.className = 'rocket';
  rocket.textContent = '🚀';
  const rect = launchBtn.getBoundingClientRect();
  rocket.style.left = (rect.left + rect.width / 2 - 14) + 'px';
  rocket.style.top = (rect.top - 6) + 'px';
  document.body.appendChild(rocket);

  const lean = (leanVw / 100) * window.innerWidth;
  const rise = -(rect.top + 36);
  const midX = lean * 0.22;
  const midY = rise * 0.58;
  const calm = typeof reduceMotion !== 'undefined' && reduceMotion;
  const dur = calm ? 700 : 2000 + Math.random() * 450;
  const a0 = noseTilt(midX || (lean >= 0 ? 8 : -8), midY);
  const a1 = noseTilt(lean - midX, rise - midY);
  const frames = calm
    ? [
        { transform: 'translate(0px, 0px)', opacity: 1 },
        { transform: `translate(0px, ${rise}px)`, opacity: 0 }
      ]
    : [
        { transform: `translate(0px, 0px) rotate(${a0.toFixed(1)}deg) scale(.92)`, opacity: 1 },
        { transform: `translate(${midX.toFixed(1)}px, ${midY.toFixed(1)}px) rotate(${((a0 + a1) / 2).toFixed(1)}deg) scale(1)`, opacity: 1, offset: 0.46 },
        { transform: `translate(${lean.toFixed(1)}px, ${rise.toFixed(1)}px) rotate(${a1.toFixed(1)}deg) scale(1)`, opacity: 0 }
      ];
  rocket.animate(frames, {
    duration: dur,
    easing: calm ? 'ease-out' : 'cubic-bezier(.08, .72, .22, 1)',
    fill: 'forwards'
  });
  setTimeout(() => rocket.remove(), dur + 40);
}

launchBtn.addEventListener('click', () => {
  clearTimeout(launchReset);
  launchStreak = Math.min(launchStreak + 1, 3);
  const count = (typeof reduceMotion !== 'undefined' && reduceMotion) ? 1 : launchStreak;
  for (let i = 0; i < count; i++) {
    const slot = count === 1 ? (Math.random() < 0.28 ? -1 : 1) : (i - (count - 1) / 2);
    const lean = slot * (count === 1 ? (9 + Math.random() * 14) : (11 + Math.abs(slot) * 7));
    setTimeout(() => spawnRocket(lean), i * 90);
  }
  launchReset = setTimeout(() => { launchStreak = 0; }, 2600);
});

/* A tap on the open sky leaves one star. A tap on the name leaves a
   few sparks. Both are small on purpose, and both stay quiet when
   the visitor has asked for reduced motion. */
function spawnWish(x, y) {
  const star = document.createElement('div');
  star.className = 'wish';
  star.textContent = '✦';
  star.style.left = x + 'px';
  star.style.top = y + 'px';
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 1600);
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 7; i++) {
    const bit = document.createElement('div');
    bit.className = 'sparkle';
    bit.style.left = x + 'px';
    bit.style.top = y + 'px';
    bit.style.setProperty('--sx', (Math.random() * 70 - 35) + 'px');
    bit.style.setProperty('--sy', (Math.random() * -56 - 8) + 'px');
    document.body.appendChild(bit);
    setTimeout(() => bit.remove(), 950);
  }
}

document.querySelector('.main-content').addEventListener('click', (e) => {
  if (e.target.closest('a, button, .name')) return;
  if (typeof reduceMotion !== 'undefined' && reduceMotion) return;
  spawnWish(e.clientX, e.clientY);
});

document.querySelector('.name').addEventListener('click', (e) => {
  if (typeof reduceMotion !== 'undefined' && reduceMotion) return;
  spawnSparkles(e.clientX, e.clientY);
});

/* ========================= SEASONAL MODES =========================
   The visitor's local date picks a scene until they choose one.
   The windows are local calendar dates, and they leave quiet gaps
   so the page is a normal night for most of the year.

   Nov 1 through Jan 2     holiday     after Halloween, before January 3
   February 1 through 14   valentine   the holiday itself, not all of February
   March 1 through 18      patrick     ends before the spring equinox
   March 20 through May 31 spring      after St. Patrick's, before a quiet June
   July 1 through July 7   july4       the week of the holiday, then night again
   October                 halloween   the whole month

   March 19, June, July 8 through September 30, and January 3
   through 31 stay off until someone picks a scene.

   The two controls are separate on purpose. The top switch only
   turns the labeled scene on or off. A status sentence did not
   read as something you can press. The bottom button only advances
   to the next scene, so turning a scene off is not the same gesture
   as choosing a different one.
*/
const holidayBtn = document.getElementById('holidayToggle');
const holidayLabel = holidayBtn.querySelector('.holiday-label');
const holidayToast = document.getElementById('holidayToast');
const modeSwitch = document.getElementById('modeSwitch');
const modeLabel = modeSwitch.querySelector('.mode-switch-label');
const modeIco = modeSwitch.querySelector('.mode-switch-ico');
const santaFly = document.getElementById('santaFly');
const witchFly = document.getElementById('witchFly');
const batFly = document.getElementById('batFly');
const lepFly = document.getElementById('lepFly');
const springFly = document.getElementById('springFly');
const snowCanvas = document.getElementById('snow');
const sctx = snowCanvas.getContext('2d', { alpha: true });

/* The bottom button walks this list one step at a time. Off is in
   the list so the visitor can land on a plain night. The order is
   the year as this page tells it: the winter holiday, then the
   dated scenes through Halloween. */
const MODE_CYCLE = ['off', 'holiday', 'valentine', 'patrick', 'spring', 'july4', 'halloween'];
const MODE_IDS = ['auto', 'off', 'holiday', 'halloween', 'july4', 'patrick', 'valentine', 'spring'];
const MODE_META = {
  off: { ico: '✨', label: 'Off' },
  holiday: {
    ico: '🎄', label: 'Holiday',
    toastOn: 'Happy holidays — the sleigh is out',
    notes: [659.25, 659.25, 659.25, 783.99, 659.25, 523.25]
  },
  valentine: {
    ico: '💗', label: 'Valentine',
    toastOn: "Happy Valentine's Day",
    notes: [523.25, 659.25, 587.33, 698.46]
  },
  patrick: {
    ico: '🍀', label: "St. Patrick's",
    toastOn: "Top o' the mornin'",
    notes: [587.33, 659.25, 739.99, 783.99, 880]
  },
  spring: {
    ico: '🦋', label: 'Spring',
    toastOn: 'Spring is in the air',
    notes: [523.25, 659.25, 783.99, 880]
  },
  july4: {
    ico: '🎆', label: 'July 4',
    toastOn: 'Light up the sky',
    notes: [523.25, 659.25, 783.99, 1046.5]
  },
  halloween: {
    ico: '🎃', label: 'Halloween',
    toastOn: 'Happy Halloween — the witch is out',
    notes: [523.25, 493.88, 440, 392]
  }
};
const GIFT_EMOJI = {
  holiday: ['🎁', '⭐', '🔔', '🍬', '🧦', '❄️'],
  halloween: ['🍬', '🎃', '🦇', '👻', '🍫'],
  july4: ['⭐', '🎇'],
  patrick: ['☘️', '🪙', '🌟', '💚'],
  valentine: ['💗', '❤️', '✨'],
  spring: ['🌸', '🌼', '🍃']
};

let choice = 'auto';
let activeMode = 'off';
let switchScene = null;
let holidayOn = false;
let flakes = [];
let dust = [];
let rockets = [];
let sparks = [];
let nextFirework = 0;
let wind = 0;
let windTarget = 0;
let nextWindAt = 0;
let giftTimer = 0;
let toastTimer = 0;
let snowWasOn = false;

function seasonalMode(date) {
  const now = date || new Date();
  const month = now.getMonth();
  const day = now.getDate();
  if (month === 9) return 'halloween';
  if (month === 10 || month === 11 || (month === 0 && day < 3)) return 'holiday';
  if (month === 1 && day <= 14) return 'valentine';
  if (month === 2 && day <= 18) return 'patrick';
  if ((month === 2 && day >= 20) || month === 3 || month === 4) return 'spring';
  if (month === 6 && day <= 7) return 'july4';
  return 'off';
}

/* Applies a scene and remembers the choice.
   dataset.mode is the scene id, or it is removed when the scene is
   off, because the CSS selectors are html[data-mode="..."].
   The top switch stays labeled with switchScene after the scene is
   turned off, so the same scene can be turned back on. It hides
   only when switchScene is cleared: nothing is in season, or the
   bottom button landed on Off.
   The bottom control always reads "Next" and shows the icon of the
   following scene. Sound plays only when a person turns a scene on. */
function setMode(mode, opts) {
  const sound = !!(opts && opts.sound);
  const announce = !!(opts && opts.announce);
  activeMode = mode && mode !== 'off' ? mode : 'off';
  holidayOn = activeMode === 'holiday';
  if (activeMode === 'off') delete document.documentElement.dataset.mode;
  else {
    document.documentElement.dataset.mode = activeMode;
    switchScene = activeMode;
  }

  if (switchScene && MODE_META[switchScene]) {
    const on = activeMode === switchScene;
    const name = MODE_META[switchScene].label;
    holidayBtn.hidden = false;
    holidayBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    holidayLabel.textContent = name;
    holidayBtn.setAttribute('aria-label', name + (on ? ', on. Turn off' : ', off. Turn on'));
  } else {
    holidayBtn.hidden = true;
    holidayBtn.setAttribute('aria-pressed', 'false');
    holidayBtn.removeAttribute('aria-label');
  }

  const base = switchScene || 'off';
  const idx = MODE_CYCLE.indexOf(base);
  const next = MODE_CYCLE[(idx < 0 ? 0 : idx + 1) % MODE_CYCLE.length];
  const nextName = next === 'off' ? 'Off' : MODE_META[next].label;
  modeIco.textContent = MODE_META[next].ico;
  modeLabel.textContent = 'Next';
  modeSwitch.setAttribute('aria-label', 'Next scene: ' + nextName);
  try { localStorage.setItem('site-mode', choice); } catch (e) {}

  if (activeMode === 'off') {
    stopEffects();
    if (announce) showToast('Back to a regular night');
  } else {
    startEffects();
    if (announce) showToast(MODE_META[activeMode].toastOn);
    if (sound) {
      burstFromButton();
      playNotes(MODE_META[activeMode].notes);
    }
  }
}

function showToast(text) {
  holidayToast.textContent = text;
  holidayToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => holidayToast.classList.remove('show'), 2600);
}

function flyerAllowed(el) {
  if (el === santaFly) return activeMode === 'holiday';
  if (el === witchFly || el === batFly) return activeMode === 'halloween';
  if (el === lepFly) return activeMode === 'patrick';
  if (el === springFly) return activeMode === 'spring';
  return false;
}

function stopFlyer(el) {
  clearTimeout(el._timer);
  clearTimeout(el._ho);
  clearTimeout(el._hoOff);
  el.hidden = true;
  el.classList.remove('cheering', 'parked');
  el.style.animation = 'none';
}

function queueFlyer(el, delay) {
  clearTimeout(el._timer);
  el._timer = setTimeout(() => launchFlyer(el), delay);
}

/* One character crosses the upper sky, then waits. Most passes stay
   high so they miss the name. Text is z-index 6 and flyers are 5,
   so a crossing still cannot cover the title. Reduced motion parks
   the character in view instead of sending it across. */
function launchFlyer(el) {
  if (!flyerAllowed(el) || reduceMotion) return;
  const lowPass = el === batFly ? false : Math.random() < 0.18;
  const duration = lowPass ? rand(8, 10) : rand(el === batFly ? 9 : 12, el === batFly ? 13 : 17);
  el.hidden = false;
  el.classList.remove('cheering');
  el.style.top = (el === batFly ? rand(8, 20) : (lowPass ? rand(24, 34) : rand(7, 18))) + 'vh';
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'santaCross ' + duration + 's linear forwards';
  if (el !== batFly) {
    el._ho = setTimeout(() => el.classList.add('cheering'), duration * 320);
    el._hoOff = setTimeout(() => el.classList.remove('cheering'), duration * 680);
  }
  el._timer = setTimeout(() => {
    el.hidden = true;
    el.classList.remove('cheering');
    if (flyerAllowed(el)) queueFlyer(el, rand(2200, 5200));
  }, duration * 1000 + 40);
}

function startEffects() {
  stopEffects();
  initSnow();
  rockets = [];
  sparks = [];
  nextFirework = 0;
  const lead = activeMode === 'holiday' ? santaFly : activeMode === 'halloween' ? witchFly : activeMode === 'patrick' ? lepFly : activeMode === 'spring' ? springFly : null;
  if (reduceMotion) {
    if (lead) {
      lead.hidden = false;
      lead.classList.add('parked');
    }
    return;
  }
  if (lead) queueFlyer(lead, 650);
  if (activeMode === 'halloween') queueFlyer(batFly, 1600);
  queueGift(activeMode === 'july4' ? 1800 : 1100);
}

function stopEffects() {
  clearTimeout(giftTimer);
  [santaFly, witchFly, batFly, lepFly, springFly].forEach(stopFlyer);
  document.querySelectorAll('.gift').forEach((g) => g.remove());
  dust = [];
  rockets = [];
  sparks = [];
}

function queueGift(delay) {
  clearTimeout(giftTimer);
  giftTimer = setTimeout(() => {
    const pack = GIFT_EMOJI[activeMode];
    if (!pack || reduceMotion) return;
    const light = activeMode === 'valentine' || activeMode === 'spring';
    const cap = light ? 2 : 5;
    if (document.querySelectorAll('.gift').length < cap) spawnGift(pack);
    queueGift(light ? rand(3200, 5600) : rand(1400, 2800));
  }, delay);
}

function spawnGift(pack) {
  const el = document.createElement('div');
  el.className = 'gift';
  el.textContent = pack[(Math.random() * pack.length) | 0];
  el.style.left = rand(4, 92) + 'vw';
  el.style.fontSize = rand(18, 34) + 'px';
  el.style.animationDuration = rand(7, 12) + 's';
  el.style.setProperty('--drift', rand(-70, 90) + 'px');
  document.body.appendChild(el);
  const life = parseFloat(el.style.animationDuration) * 1000 + 200;
  setTimeout(() => el.remove(), life);
}

function burstFromButton() {
  const rect = holidayBtn.getBoundingClientRect();
  const x = (rect.left + rect.width / 2) * dpr;
  const y = rect.bottom * dpr;
  for (let i = 0; i < 28; i++) {
    const ang = rand(-Math.PI, 0);
    const spd = rand(0.8, 3.2);
    dust.push({
      x: x,
      y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd * 0.65,
      life: 1,
      r: rand(1.1, 2.6),
      gold: Math.random() < 0.6
    });
  }
}

function playNotes(notes) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx || !notes) return;
  try {
    const audio = new AudioCtx();
    notes.forEach((freq, i) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audio.destination);
      const t = audio.currentTime + i * 0.14;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.start(t);
      osc.stop(t + 0.24);
    });
    setTimeout(() => audio.close(), 1800);
  } catch (e) {}
}

/* One canvas draws snow, leaves, coins, hearts, or petals.
   Valentine and spring use only a few slow pieces. A full field
   would turn those quiet seasons into a blizzard. */
function makeFlake(anywhere) {
  const gentle = activeMode === 'valentine' || activeMode === 'spring';
  const roll = Math.random();
  return {
    x: Math.random() * Math.max(snowCanvas.width, 1),
    y: anywhere ? Math.random() * Math.max(snowCanvas.height, 1) : -rand(4, 40),
    r: gentle ? rand(2.4, 4.4) : rand(0.6, 2.7),
    vy: gentle ? rand(0.1, 0.32) : rand(0.28, 0.95),
    vx: rand(-0.18, 0.18),
    wobble: rand(0, Math.PI * 2),
    wobbleSpeed: gentle ? rand(0.004, 0.012) : rand(0.01, 0.025),
    o: rand(0.4, 0.9),
    hue: Math.random(),
    kind: activeMode === 'valentine' ? 'heart' : activeMode === 'spring' ? 'petal' : (roll > 0.86 ? 'star' : 'dot')
  };
}

function initSnow() {
  let count = Math.min(200, Math.floor((innerWidth * innerHeight) / 13000));
  if (activeMode === 'valentine') count = Math.min(16, Math.max(8, Math.floor(innerWidth / 80)));
  else if (activeMode === 'spring') count = Math.min(20, Math.max(10, Math.floor(innerWidth / 70)));
  flakes = [];
  for (let i = 0; i < count; i++) flakes.push(makeFlake(true));
}

function drawHeart(x, y, s, color) {
  sctx.save();
  sctx.translate(x, y);
  sctx.scale(s, s);
  sctx.fillStyle = color;
  sctx.beginPath();
  sctx.moveTo(0, 0.35);
  sctx.bezierCurveTo(-0.62, -0.2, -0.4, -0.9, 0, -0.42);
  sctx.bezierCurveTo(0.4, -0.9, 0.62, -0.2, 0, 0.35);
  sctx.fill();
  sctx.restore();
}

function drawSnowflake(x, y, r, alpha) {
  sctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
  sctx.lineWidth = Math.max(1, dpr * 0.7);
  sctx.beginPath();
  for (let a = 0; a < 6; a++) {
    const ang = a * Math.PI / 3;
    sctx.moveTo(x, y);
    sctx.lineTo(x + Math.cos(ang) * r * 3.1, y + Math.sin(ang) * r * 3.1);
  }
  sctx.stroke();
}

function paintFlake(f) {
  if (f.kind === 'heart') {
    const color = f.hue > 0.5 ? 'rgba(255,77,106,' + f.o + ')' : 'rgba(255,150,180,' + f.o + ')';
    drawHeart(f.x, f.y, f.r * dpr * 5.2, color);
    return;
  }
  if (f.kind === 'petal') {
    const color = f.hue > 0.66
      ? 'rgba(255,214,226,' + f.o + ')'
      : f.hue > 0.33
        ? 'rgba(255,236,210,' + f.o + ')'
        : 'rgba(255,176,198,' + f.o + ')';
    sctx.save();
    sctx.translate(f.x, f.y);
    sctx.rotate(f.wobble);
    sctx.fillStyle = color;
    sctx.beginPath();
    sctx.ellipse(0, 0, f.r * dpr * 2.3, f.r * dpr * 0.95, 0, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();
    return;
  }
  if (activeMode === 'patrick') {
    sctx.fillStyle = 'rgba(242,193,78,' + f.o + ')';
    sctx.beginPath();
    sctx.arc(f.x, f.y, (f.r + 0.8) * dpr, 0, Math.PI * 2);
    sctx.fill();
    return;
  }
  if (activeMode === 'halloween') {
    sctx.fillStyle = f.kind === 'star' ? 'rgba(255,140,40,' + f.o + ')' : 'rgba(190,140,255,' + f.o + ')';
    sctx.beginPath();
    sctx.ellipse(f.x, f.y, f.r * dpr * 1.8, f.r * dpr * 0.7, f.wobble, 0, Math.PI * 2);
    sctx.fill();
    return;
  }
  if (f.kind === 'star') drawSnowflake(f.x, f.y, f.r * dpr, f.o);
  else {
    sctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r * dpr, 0, Math.PI * 2);
    sctx.fill();
  }
}

function starTint(s) {
  if (activeMode === 'holiday' && s.depth > 0.72) return s.phase > 3 ? '#ffe08a' : '#d7f6ff';
  if (activeMode === 'halloween' && s.depth > 0.6) return s.phase > 3 ? '#ffb15a' : '#e2c6ff';
  if (activeMode === 'july4' && s.depth > 0.55) return ['#ff7a7a', '#ffffff', '#8ecbff'][Math.floor(s.phase) % 3];
  if (activeMode === 'patrick' && s.depth > 0.6) return s.phase > 3 ? '#d6ff9a' : '#ffe08a';
  if (activeMode === 'valentine' && s.depth > 0.72) return s.phase > 3 ? '#ffd0dc' : '#ffe08a';
  if (activeMode === 'spring' && s.depth > 0.72) return s.phase > 3 ? '#ffe9b0' : '#ffd6e4';
  return '#ffffff';
}

function shootingTint() {
  if (activeMode === 'halloween') return 'rgba(255,160,60,0.95)';
  if (activeMode === 'july4') return 'rgba(255,255,255,0.95)';
  if (activeMode === 'patrick') return 'rgba(190,255,150,0.95)';
  if (activeMode === 'holiday') return 'rgba(255,224,138,0.95)';
  if (activeMode === 'valentine') return 'rgba(255,170,190,0.95)';
  if (activeMode === 'spring') return 'rgba(255,224,170,0.95)';
  return 'rgba(255,255,255,0.90)';
}

function burstFirework(x, y, color) {
  for (let i = 0; i < 46; i++) {
    const ang = (i / 46) * Math.PI * 2 + rand(-0.08, 0.08);
    const spd = rand(0.5, 2.5) * dpr;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      r: rand(1.8, 3.4),
      color: Math.random() < 0.22 ? '#ffffff' : color
    });
  }
}

/* July 4 uses the same canvas as the falling particles, but with a
   few rockets instead. Each one climbs, bursts, and fades. Reduced
   motion skips this so the sky stays still. */
function drawFireworks(dt, now, sw, sh) {
  if (now > nextFirework && rockets.length < 4) {
    nextFirework = now + rand(160, 520);
    rockets.push({
      x: rand(sw * 0.15, sw * 0.85),
      y: sh * 0.96,
      vx: rand(-0.4, 0.4) * dpr,
      vy: -rand(3.4, 5.2) * dpr,
      color: ['#ff4b4b', '#ffffff', '#79b8ff', '#ffd24d'][(Math.random() * 4) | 0],
      life: rand(520, 900)
    });
  }
  sctx.clearRect(0, 0, sw, sh);
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx * dt * 0.16;
    r.y += r.vy * dt * 0.16;
    r.vy += 0.0015 * dt;
    r.life -= dt;
    sctx.globalAlpha = 0.95;
    sctx.strokeStyle = 'rgba(255,246,216,0.85)';
    sctx.lineWidth = 2 * dpr;
    sctx.beginPath();
    sctx.moveTo(r.x, r.y);
    sctx.lineTo(r.x - r.vx * 8, r.y - r.vy * 6);
    sctx.stroke();
    if (r.life <= 0) {
      burstFirework(r.x, r.y, r.color);
      rockets.splice(i, 1);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt * 0.16;
    p.y += p.vy * dt * 0.16;
    p.vy += 0.0035 * dt;
    p.life -= dt / 980;
    if (p.life <= 0) {
      sparks.splice(i, 1);
      continue;
    }
    sctx.globalAlpha = Math.max(0, p.life);
    sctx.fillStyle = p.color;
    sctx.beginPath();
    sctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
  if (sparks.length > 420) sparks.splice(0, sparks.length - 420);
}

/* Top switch: toggle the scene it is labeled with. It does not cycle.
   Off stores "off". On stores that scene's id, not "auto", so a
   reload leaves the scene on instead of handing it back to the date. */
holidayBtn.addEventListener('click', () => {
  if (!switchScene) return;
  if (activeMode === switchScene) {
    choice = 'off';
    setMode('off', { announce: true });
  } else {
    choice = switchScene;
    setMode(switchScene, { sound: true, announce: true });
  }
});

/* Bottom button: one step forward. The step is taken from the labeled
   scene, even if that scene is currently switched off. Landing on
   Off clears the top switch. Any other step turns that scene on. */
modeSwitch.addEventListener('click', () => {
  const base = switchScene || 'off';
  const current = MODE_CYCLE.indexOf(base);
  const next = MODE_CYCLE[(current < 0 ? 0 : current + 1) % MODE_CYCLE.length];
  choice = next;
  switchScene = next === 'off' ? null : next;
  setMode(next, { sound: next !== 'off', announce: true });
});

/* ========================= STARFIELD ========================= */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d', { alpha: true });
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let dpr = 1;
let stars = [];
let shootingStar = null;
let nextShootingStarAt = 0;

const pointer = { x: 0.5, y: 0.5 };
const smooth = { x: 0.5, y: 0.5 };

addEventListener('mousemove', (e) => {
  pointer.x = e.clientX / innerWidth;
  pointer.y = e.clientY / innerHeight;
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (!e.touches.length) return;
  pointer.x = e.touches[0].clientX / innerWidth;
  pointer.y = e.touches[0].clientY / innerHeight;
}, { passive: true });

function rand(min, max) { return Math.random() * (max - min) + min; }

function initStars() {
  const count = Math.floor((innerWidth * innerHeight) / 2800);
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: rand(0.3, 1.4),
      o: rand(0.25, 0.85),
      depth: rand(0.15, 1.0),
      phase: rand(0, Math.PI * 2),
      speed: rand(0.0003, 0.0008)
    });
  }
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  snowCanvas.width = canvas.width;
  snowCanvas.height = canvas.height;
  snowCanvas.style.width = '100vw';
  snowCanvas.style.height = '100vh';
  snowWasOn = false;
  initStars();
  initSnow();
}

addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', resize, { passive: true });

function createShootingStar() {
  const fromLeft = Math.random() < 0.5;
  return {
    x: fromLeft ? -0.1 * canvas.width : 1.1 * canvas.width,
    y: rand(0.08, 0.65) * canvas.height,
    vx: (fromLeft ? 1 : -1) * rand(0.5, 0.9) * dpr,
    vy: rand(-0.08, 0.14) * dpr,
    length: rand(100, 190) * dpr,
    width: rand(1.2, 2.2) * dpr,
    life: rand(900, 1500)
  };
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(33, now - last);
  last = now;

  const w = canvas.width;
  const h = canvas.height;

  smooth.x += (pointer.x - smooth.x) * 0.05;
  smooth.y += (pointer.y - smooth.y) * 0.05;
  const mx = smooth.x - 0.5;
  const my = smooth.y - 0.5;

  ctx.clearRect(0, 0, w, h);

  for (const s of stars) {
    const twinkle = reduceMotion ? 1 : (0.78 + 0.22 * Math.sin(s.phase + now * s.speed));
    const px = (s.x + mx * s.depth * 0.06) * w;
    const py = (s.y + my * s.depth * 0.06) * h;

    ctx.globalAlpha = s.o * twinkle;
    ctx.fillStyle = starTint(s);
    ctx.beginPath();
    ctx.arc(px, py, s.r * dpr, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  if (!reduceMotion) {
    if (!shootingStar && now >= nextShootingStarAt) {
      shootingStar = createShootingStar();
    }

    if (shootingStar) {
      const c = shootingStar;
      c.x += c.vx * dt * 0.16;
      c.y += c.vy * dt * 0.16;
      c.life -= dt;

      const tx = c.x - c.vx * c.length;
      const ty = c.y - c.vy * c.length;
      const grad = ctx.createLinearGradient(c.x, c.y, tx, ty);
      grad.addColorStop(0, shootingTint());
      grad.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = c.width;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      if (c.life <= 0 || c.x < -0.2 * w || c.x > 1.2 * w) {
        shootingStar = null;
        nextShootingStarAt = now + rand(2500, 7000);
      }
    }
  }

  const sw = snowCanvas.width;
  const sh = snowCanvas.height;
  const fxOn = activeMode === 'holiday' || activeMode === 'halloween' || activeMode === 'patrick' || activeMode === 'july4' || activeMode === 'valentine' || activeMode === 'spring';
  if (!fxOn) {
    if (snowWasOn) {
      sctx.clearRect(0, 0, sw, sh);
      snowWasOn = false;
      dust = [];
    }
  } else if (activeMode === 'july4' && !reduceMotion) {
    snowWasOn = true;
    drawFireworks(dt, now, sw, sh);
  } else if (!reduceMotion) {
    snowWasOn = true;
    if (now > nextWindAt) {
      windTarget = rand(-0.55, 0.55);
      nextWindAt = now + rand(2800, 7000);
    }
    wind += (windTarget - wind) * 0.012;

    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.wobble += f.wobbleSpeed * dt;
      f.y += (f.vy + f.r * 0.18) * dt * 0.07 * dpr;
      f.x += (f.vx + wind + Math.sin(f.wobble) * 0.28) * dt * 0.07 * dpr;
      if (f.y > sh + 8) {
        flakes[i] = makeFlake(false);
        continue;
      }
      if (f.x < -12) f.x = sw + 8;
      if (f.x > sw + 12) f.x = -8;
      paintFlake(f);
    }

    const trailEl = [santaFly, witchFly, lepFly, springFly].find((el) => !el.hidden);
    if (trailEl) {
      const box = trailEl.getBoundingClientRect();
      if (Math.random() < 0.85) {
        dust.push({
          x: box.left * dpr,
          y: (box.top + box.height * 0.62) * dpr,
          vx: -rand(0.15, 1.1) * dpr,
          vy: rand(-0.25, 0.35) * dpr,
          life: 1,
          r: rand(1, 2.4),
          gold: Math.random() < 0.75
        });
      }
    }

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * dt * 0.16;
      p.y += p.vy * dt * 0.16;
      p.vy += 0.004 * dt;
      p.life -= dt / 700;
      if (p.life <= 0) {
        dust.splice(i, 1);
        continue;
      }
      sctx.globalAlpha = Math.max(0, p.life);
      sctx.fillStyle = p.gold
        ? (activeMode === 'halloween' ? '#ffb15a' : activeMode === 'valentine' ? '#ff8ab0' : activeMode === 'spring' ? '#ffd0e0' : '#ffe08a')
        : '#ffffff';
      sctx.beginPath();
      sctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
    if (dust.length > 90) dust.splice(0, dust.length - 90);
  } else if (!snowWasOn) {
    snowWasOn = true;
    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) paintFlake(flakes[i]);
  }

  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

/* site-mode is "auto", "off", or a scene id.
   "auto" means trust the calendar. An explicit id or "off" wins
   over the date, including after a reload. Turning the top switch
   off stores "off" and keeps the season label. The older
   holiday-mode value of "0" still means off, for visitors who
   saved that before site-mode existed. */
try {
  const saved = localStorage.getItem('site-mode');
  if (MODE_IDS.indexOf(saved) !== -1) choice = saved;
  else if (localStorage.getItem('holiday-mode') === '0') choice = 'off';
} catch (e) {}
if (choice === 'off') {
  const season = seasonalMode();
  switchScene = season === 'off' ? null : season;
  setMode('off');
} else if (choice === 'auto') {
  const season = seasonalMode();
  switchScene = season === 'off' ? null : season;
  setMode(season);
} else {
  switchScene = choice;
  setMode(choice);
}
