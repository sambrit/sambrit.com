<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Sambrit Adhikari | Product Manager, Engineer, and Photographer</title>

  <meta property="og:description" content="Sambrit Adhikari is a product manager, engineer, and photographer. This page links to his GitHub, photography, and LinkedIn."/>
  <meta property="og:url" content="https://sambrit.com/"/>

  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="Sambrit Adhikari | Product Manager, Engineer, and Photographer"/>
  <meta name="twitter:description" content="Sambrit Adhikari is a product manager, engineer, and photographer. This page links to his GitHub, photography, and LinkedIn."/>
  <meta name="twitter:url" content="https://sambrit.com/"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">

  <style>
  :root {
    --text: #FAFAFA;
    --accent: #FFD700;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: 'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #0a0d14 0%, #0b1020 50%, #0d1428 100%);
    overflow: hidden;
    position: relative;
  }

  #bg, #snow {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    pointer-events: none;
  }

  #bg { z-index: 0; }
  #snow { z-index: 4; }

  .glow {
    position: fixed;
    inset: -10vmax;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(38vmax 38vmax at 20% 22%, rgba(71, 222, 232, 0.14), transparent 62%),
      radial-gradient(35vmax 35vmax at 80% 73%, rgba(250, 204, 21, 0.10), transparent 66%),
      radial-gradient(40vmax 40vmax at 50% 58%, rgba(244, 114, 182, 0.08), transparent 68%);
    filter: blur(9px);
  }

  .main-content {
    position: relative;
    z-index: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }

  .kicker, .name, .nav-links { position: relative; z-index: 6; }

  .kicker {
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.72rem;
    font-weight: 700;
    color: #BFFBFF;
    text-shadow: 0 2px 8px rgba(0,0,0,0.62);
  }

  /* The name stays a solid gold-family color. A seasonal tint is fine.
     Clipping the letters to a gradient made them look hollow, so the
     color is painted on the text itself. Flyers sit under this text. */
  .name {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    margin: 10px 0 0;
    color: var(--accent);
    letter-spacing: .6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
    animation: nameGlow 7s ease-in-out infinite;
  }
  @keyframes nameGlow {
    0%, 100% { text-shadow: 0 2px 10px rgba(0,0,0,.8), 0 0 12px rgba(255, 215, 0, .15); }
    50% { text-shadow: 0 2px 10px rgba(0,0,0,.8), 0 0 28px rgba(255, 215, 0, .45); }
  }

  .nav-links {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-link {
    text-decoration: none;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,.35);
    padding: 10px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    backdrop-filter: blur(6px);
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .nav-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(0,0,0,.35);
    background: rgba(255,255,255,.08);
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }

  .modal[hidden] {
    display: none;
  }

  .modal-card {
    background: rgba(15,15,20,0.9);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    width: min(92vw, 380px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal-title {
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: 0.3px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform .15s ease, background .15s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.12);
  }

  .btn.primary {
    background: linear-gradient(90deg, #facc15, #22d3ee);
    color: #0a0a0a;
    font-weight: 800;
    border: none;
  }

  .launch-button {
    position: fixed;
    z-index: 8;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom));
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #0a0a0a;
    background: var(--accent);
    border: none;
    cursor: pointer;
    user-select: none;
    transition: transform .2s ease, filter .2s ease;
    touch-action: manipulation;
  }

  .launch-button:hover {
    transform: translateX(-50%) translateY(-2px);
    filter: brightness(1.08);
  }

  .launch-button:active {
    transform: translateX(-50%) scale(0.97);
  }

  .name { cursor: pointer; }

  .wish, .sparkle {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    line-height: 1;
  }

  .wish {
    font-size: 14px;
    color: #fff;
    animation: wish 1.5s ease-out forwards;
  }
  .ripple {
    position: fixed;
    z-index: 4;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border: 1px solid rgba(255, 224, 160, .8);
    border-radius: 50%;
    pointer-events: none;
    animation: ripple .9s ease-out forwards;
  }
  @keyframes ripple {
    to { transform: scale(7); opacity: 0; }
  }
  .feather {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    font-size: 16px;
    animation: feather 2.6s ease-in forwards;
  }
  @keyframes feather {
    to { transform: translate(36px, 14vh) rotate(70deg); opacity: 0; }
  }

  .sparkle {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffe08a;
    box-shadow: 0 0 8px #ffd700;
    animation: sparkle 900ms ease-out forwards;
  }

  @keyframes wish {
    0% { transform: translate(-50%, -40%) scale(.7); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(-50%, -64px) scale(1); opacity: 0; }
  }

  @keyframes sparkle {
    0% { transform: translate(0, 0) scale(.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(1); opacity: 0; }
  }

  .rocket {
    position: fixed;
    z-index: 9;
    width: 1.15em;
    height: 1.15em;
    font-size: 72px;
    line-height: 1;
    pointer-events: none;
    will-change: transform;
    filter: drop-shadow(0 10px 8px rgba(0,0,0,.4));
  }
  .rocket-emoji {
    display: block;
    transform: rotate(-45deg);
    transform-origin: 50% 58%;
  }

  .astronaut {
    position: fixed;
    z-index: 9;
    font-size: 52px;
    line-height: 1;
    pointer-events: none;
  }
  .astro-emoji {
    display: block;
    transform-origin: 50% 80%;
    animation: astroWave 1s ease-in-out infinite;
  }
  @keyframes astroWave {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(12deg); }
  }

  .countdown {
    position: fixed;
    z-index: 9;
    left: 50%;
    bottom: calc(78px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    margin: 0;
    font-weight: 800;
    font-size: 2.4rem;
    letter-spacing: .04em;
    color: #ffe08a;
    text-shadow: 0 0 16px rgba(255, 180, 40, .65);
    pointer-events: none;
  }
  .countdown[hidden] { display: none !important; }
  .countdown.pop { animation: countPop .62s ease-out; }
  @keyframes countPop {
    0% { transform: translateX(-50%) scale(.4); opacity: 0; }
    35% { transform: translateX(-50%) scale(1.12); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
  .astronaut.pop { animation: astroHop 1.6s ease-in-out; }
  @keyframes astroHop {
    0% { transform: translate(-50%, -70%) scale(.6); }
    18% { transform: translate(-50%, -130%) scale(1); }
    32% { transform: translate(-50%, -110%) scale(1); }
    48% { transform: translate(-50%, -122%); }
    100% { transform: translate(-50%, -110%); }
  }
  .charm {
    position: absolute;
    left: 70%;
    top: 0;
    font-size: 16px;
    animation: charmUp 1.6s ease-out forwards;
  }
  @keyframes charmUp {
    to { transform: translateY(-36px); opacity: 0; }
  }

  /* The flame is its own speck, not part of the emoji, so it can sit
     on the engines and go out on touchdown. The payload is a small
     unmarked capsule so the separation reads without a caption. */
  .exhaust {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 7;
  }

  .payload {
    position: fixed;
    z-index: 9;
    width: 14px;
    height: 8px;
    border-radius: 4px;
    pointer-events: none;
    background: linear-gradient(180deg, #f7fafc, #c5d2df 58%, #93a6b8);
    box-shadow: 0 0 8px rgba(255, 236, 190, .55);
  }

  /* Season switch. It used to sit in the horizontal center of the
     light string, and that made the control the first thing on the
     page. It now sits at the top left, under the bulbs and inset
     from the safe area, so the lights and the name stay the focus.
     It is still a real switch: the season name, a track, and a knob.
     The knob moves right only while aria-pressed is true. The label
     can wrap to two short lines on a narrow phone. Centering it
     again would put it back in the lights. Script keeps the control
     visible after the scene is turned off, when data-mode is gone,
     so the knob cannot key off the scene. */
  .holiday-toggle {
    position: fixed;
    z-index: 8;
    top: calc(54px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
    max-width: min(58vw, 210px);
    padding: 3px 5px 3px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(8,10,16,.42);
    color: rgba(250,250,250,.8);
    font-family: inherit;
    font-weight: 600;
    font-size: .72rem;
    letter-spacing: 0;
    line-height: 1.05;
    text-align: left;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    backdrop-filter: blur(8px);
    box-shadow: none;
    transition: background .2s ease;
  }

  .holiday-label {
    display: block;
    max-width: 8.2rem;
    text-align: left;
    line-height: 1.05;
  }

  .holiday-when {
    display: block;
    margin-top: 1px;
    font-weight: 500;
    font-size: .62rem;
    letter-spacing: 0;
    opacity: .72;
  }

  .holiday-toggle:hover {
    background: rgba(255,255,255,.08);
  }

  .holiday-toggle:active {
    background: rgba(255,255,255,.12);
  }

  .holiday-toggle:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  .switch {
    position: relative;
    flex: none;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: #3a4150;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
  }

  .switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: transform .18s ease;
  }

  .holiday-toggle[aria-pressed="true"] .switch {
    background: #3dcc7a;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  }

  .holiday-toggle[aria-pressed="true"] .switch-knob {
    transform: translateX(14px);
  }

  .holiday-toast {
    position: fixed;
    top: calc(clamp(132px, 22vh, 190px) + env(safe-area-inset-top));
    left: 50%;
    z-index: 8;
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(20, 8, 12, .78);
    color: #ffe08a;
    font-weight: 700;
    font-size: .86rem;
    letter-spacing: .03em;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity .35s ease, transform .35s ease;
    text-align: center;
    max-width: min(92vw, 420px);
  }

  .holiday-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* One string of lights for every scene. Each mode only recolors
     the bulbs, so Halloween, July 4, Valentine, Spring, and
     Thanksgiving share the same wire. Valentine stays amber and
     rose because a field of hearts was the wrong tone here.
     Thanksgiving is warm amber and brown, lighter than Halloween. */
  .xmas-lights {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-14px);
    transition: opacity .45s ease, transform .5s ease;
  }

  html[data-mode="holiday"] .xmas-lights,
  html[data-mode="halloween"] .xmas-lights,
  html[data-mode="july4"] .xmas-lights,
  html[data-mode="patrick"] .xmas-lights,
  html[data-mode="valentine"] .xmas-lights,
  html[data-mode="spring"] .xmas-lights,
  html[data-mode="summer"] .xmas-lights,
  html[data-mode="autumn"] .xmas-lights,
  html[data-mode="sequinox"] .xmas-lights,
  html[data-mode="aequinox"] .xmas-lights,
  html[data-mode="ssolstice"] .xmas-lights,
  html[data-mode="wsolstice"] .xmas-lights,
  html[data-mode="thanksgiving"] .xmas-lights {
    opacity: 1;
    transform: none;
  }

  .xmas-wire {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .bulbs {
    position: absolute;
    left: 0;
    right: 0;
    top: 16px;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
  }

  .bulb {
    display: block;
    width: 10px;
    height: 14px;
    border-radius: 6px 6px 9px 9px;
    box-shadow: 0 0 10px currentColor, 0 8px 10px rgba(0,0,0,.15);
    animation: bulb 1.5s ease-in-out infinite;
  }

  .bulb:nth-child(5n+1) { color: #ff4d4d; background: #ff4d4d; animation-delay: 0s; }
  .bulb:nth-child(5n+2) { color: #ffd24d; background: #ffd24d; animation-delay: .25s; }
  .bulb:nth-child(5n+3) { color: #3dcc7a; background: #3dcc7a; animation-delay: .5s; }
  .bulb:nth-child(5n+4) { color: #7fd4ff; background: #7fd4ff; animation-delay: .75s; }
  .bulb:nth-child(5n) { color: #ff8ad4; background: #ff8ad4; animation-delay: 1s; }

  @keyframes bulb {
    0%, 100% { filter: brightness(1.15); opacity: 1; }
    50% { filter: brightness(.45); opacity: .55; }
  }

  .snowbank {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 96px;
    z-index: 2;
    pointer-events: none;
    display: block;
    transform: translateY(105%);
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
  }

  html[data-mode="holiday"] .snowbank { transform: translateY(0); }

  .corner-deco {
    position: fixed;
    z-index: 5;
    bottom: 8px;
    font-size: 46px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.35));
    transform: translateY(140%);
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }

  .corner-deco.tree,
  .corner-deco.pumpkin:not(.right),
  .corner-deco.flag:not(.right),
  .corner-deco.shamrock:not(.right),
  .corner-deco.candle,
  .corner-deco.blossom:not(.right),
  .corner-deco.turkey { left: 14px; }

  .holiday-toggle[hidden] { display: none !important; }
  .corner-deco.right {
    right: 132px;
    font-size: 34px;
    bottom: 18px;
  }

  html[data-mode="holiday"] .corner-deco.tree,
  html[data-mode="holiday"] .corner-deco.star { transform: translateY(0); }
  html[data-mode="holiday"] .corner-deco.star { animation: spin-slow 8s linear infinite; }
  html[data-mode="halloween"] .corner-deco.pumpkin { transform: translateY(0); }
  html[data-mode="july4"] .corner-deco.flag { transform: translateY(0); }
  html[data-mode="patrick"] .corner-deco.shamrock { transform: translateY(0); }
  html[data-mode="valentine"] .corner-deco.candle { transform: translateY(0); }
  html[data-mode="spring"] .corner-deco.blossom { transform: translateY(0); }
  html[data-mode="thanksgiving"] .corner-deco.turkey { transform: translateY(0); }
  html[data-mode="spring"] .flower-field,
  html[data-mode="sequinox"] .flower-field { opacity: 1; }
  .corner-deco.candle { font-size: 28px; }
  .corner-deco.turkey { font-size: 30px; }

  .day-sun {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right));
    width: 74px;
    height: 74px;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    background: radial-gradient(circle at 35% 35%, #fff8d4, #ffd35a 52%, #f0a018 78%, rgba(240, 160, 24, 0));
    box-shadow: 0 0 42px rgba(255, 196, 70, .55);
    transition: opacity .5s ease, transform .5s ease;
  }
  html[data-mode="summer"] .day-sun,
  html[data-mode="ssolstice"] .day-sun,
  html[data-mode="sequinox"] .day-sun { opacity: 1; }
  html[data-mode="ssolstice"] .day-sun { transform: scale(1.45); }
  html[data-mode="thanksgiving"] .corner-deco.turkey { animation: turkeyBob 2.2s ease-in-out infinite; }
  @keyframes turkeyBob {
    50% { transform: translateY(-8px) rotate(-8deg); }
  }
  html[data-mode="july4"] .corner-deco.flag { animation: flagWave 1.4s ease-in-out infinite; transform-origin: left bottom; }
  @keyframes flagWave {
    50% { transform: translateY(0) rotate(6deg); }
  }
  html[data-mode="halloween"] .corner-deco.pumpkin { animation: pumpFlicker 1.8s ease-in-out infinite; }
  @keyframes pumpFlicker {
    0%, 100% { filter: drop-shadow(0 8px 8px rgba(0,0,0,.35)) brightness(1); }
    50% { filter: drop-shadow(0 0 12px rgba(255, 140, 40, .8)) brightness(1.25); }
  }
  .wing, .ear {
    transform-box: fill-box;
    transform-origin: 80% 80%;
    animation: flap .55s ease-in-out infinite;
  }
  .ear { transform-origin: 50% 100%; animation-duration: .7s; }
  @keyframes flap {
    50% { transform: rotate(-14deg); }
  }

  .aurora {
    position: fixed;
    left: -10%;
    right: -10%;
    top: 8vh;
    height: 28vh;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(120, 220, 180, .18), rgba(160, 190, 255, .22), rgba(255, 210, 140, .14), transparent);
    filter: blur(18px);
    animation: aurora 14s ease-in-out infinite;
  }
  html[data-mode="holiday"] .aurora,
  html[data-mode="wsolstice"] .aurora { opacity: 1; }
  @keyframes aurora {
    0%, 100% { transform: translateX(-4%) skewX(-8deg); }
    50% { transform: translateX(6%) skewX(8deg); }
  }

  .drift-cloud {
    position: fixed;
    top: 46px;
    left: -20%;
    width: 140px;
    height: 36px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,0));
    filter: blur(2px);
  }
  html[data-mode="summer"] .drift-cloud,
  html[data-mode="ssolstice"] .drift-cloud { opacity: .85; animation: cloudPass 28s linear infinite; }
  @keyframes cloudPass {
    from { left: -20%; }
    to { left: 110%; }
  }

  .gold-pot {
    position: fixed;
    right: 4vw;
    top: 40vh;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    filter: drop-shadow(0 0 8px rgba(255, 210, 80, .85));
  }
  .gold-pot i {
    display: inline-block;
    width: 18px;
    height: 18px;
    margin-left: -7px;
    border-radius: 50%;

  .moon, .fog, .rainbow { pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  .moon {
    position: fixed;
    top: 14vh;
    right: 7vw;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    z-index: 1;

  .fog {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 140px;
    z-index: 2;
    background: linear-gradient(to top, rgba(40, 16, 60, .72), rgba(40, 16, 60, 0));
  }
  .rainbow {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 46vh;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

    position: absolute;
    left: 50%;
    top: 0;
    width: 150vw;
    height: 150vw;
    border-radius: 50%;
    transform: translate(-50%, -8%);
    background: radial-gradient(circle at 50% 50%,
      transparent 58%,
      rgba(255, 70, 70, .92) 58.4% 59.6%,
      rgba(255, 150, 30, .9) 60% 61.2%,
      rgba(255, 220, 60, .9) 61.6% 62.8%,
      rgba(60, 200, 90, .9) 63.2% 64.4%,
      rgba(60, 140, 255, .9) 64.8% 66%,
      rgba(140, 90, 255, .88) 66.4% 67.6%,
      transparent 68%);

    position: fixed;

    z-index: 4;
    pointer-events: none;
    opacity: 0;
  }

  .ghosts span {
    position: absolute;
    font-size: 30px;
    animation: ghostFloat 8s ease-in-out infinite;
  }
  .ghosts span:nth-child(1) { left: 60%; top: 15%; animation-delay: -2s; }
  .ghosts span:nth-child(2) { left: 84%; top: 24%; animation-delay: -5s; font-size: 22px; }
  @keyframes ghostFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(28px); }
  }

  #geeseFly, #owlFly, .bat-flight { width: auto; font-size: 28px; letter-spacing: .45em; }
  #owlFly { font-size: 36px; letter-spacing: 0; }

  /* Bottom control. It is a separate button because the top switch
     only turns the current scene on or off. This one advances.
     The visible word is always "Next", beside the icon of the scene
     you will land on, so the action is obvious on a phone without
     crowding the centered Launch button. */
  .mode-switch {
    position: fixed;
    z-index: 8;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 12px 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(8,10,16,.72);
    color: #fafafa;
    font-family: inherit;
    font-weight: 700;
    font-size: .82rem;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  .mode-switch:hover { background: rgba(255,255,255,.1); }
  .mode-switch:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Reduced motion keeps the scenes and drops the travel. Bulbs
     and the switch knob stop moving, and a flyer parks in view
     instead of crossing the sky. Thanksgiving has no flyer, so the
     still frame is the lights, the leaves, and the corner mark. */
  @media (prefers-reduced-motion: reduce) {
    .nav-link { transition: none !important; }
    .btn { transition: none !important; }
    .launch-button, .wish, .sparkle { transition: none !important; animation: none !important; }
    .bulb, .deer-bob, .leg, .wave, .nose-glow, .scarf, .spark-trail i,
    .corner-deco, .santa-bob, .ghosts span, .switch-knob,
    .ground-life i, .flower-field span, .hopper, .astro-emoji, .litter span, .sky-roses span,
    .name, .aurora, .drift-cloud, .meet, .horizon, .wing, .ear,
    .corner-deco.turkey, .corner-deco.flag, .corner-deco.pumpkin {
      animation: none !important;
    }
    .switch-knob { transition: none !important; }
    html[data-mode="holiday"] .santa-fly.parked {
      top: auto;
      bottom: 78px;
      right: 8px;
      left: auto;
      width: min(300px, 72vw);
      animation: none !important;
      transform: none !important;
    }
    html[data-mode="halloween"] #witchFly.parked,
    html[data-mode="patrick"] #lepFly.parked,
    html[data-mode="thanksgiving"] #turkeyFly.parked {
      top: 11vh;
      left: 5vw;
      right: auto;
      animation: none !important;
      transform: none !important;
    }
  }

  @media (max-width: 700px) {
    .kicker { font-size: .64rem; }
    .nav-link { font-size: .92rem; padding: 10px 13px; }
    .holiday-toggle {
      font-size: .68rem;
      padding: 2px 4px 2px 7px;
      gap: 5px;
      max-width: 42vw;
    }
    .holiday-label { max-width: 7.2rem; }
    .corner-deco.turkey { font-size: 24px; }
    .corner-deco.candle { font-size: 22px; }
    .holiday-toast { font-size: .78rem; max-width: 88vw; }
    .corner-deco { font-size: 32px; }
    .corner-deco.right {
      font-size: 22px;
      right: 12px;
      bottom: 78px;
      transform: translateY(150px);
    }
    .mode-switch {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      justify-content: center;
      right: 10px;
      bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .launch-button {
      bottom: calc(16px + env(safe-area-inset-bottom));
      padding: 12px 20px;
    }
    .rocket { font-size: 56px; }
    .astronaut { font-size: 42px; }
    .countdown { font-size: 2rem; }
  }
  </style>

  <script>
/* ========================= CONTACT ========================= */
const contactBtn = document.querySelector('.contact-btn');
const modal = document.getElementById('contactModal');
const mailOpenBtn = document.getElementById('mailOpenBtn');
const copyBtn = document.getElementById('copyBtn');
const closeModalBtn = document.getElementById('closeModalBtn');

function buildEmail() {

    await navigator.clipboard.writeText(email);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy email'; }, 1200);
  } catch {
    copyBtn.textContent = email;
  }
});

/* ========================= LAUNCH =========================
   The launch button is the visitor's own flight. The season owns
   the sky. Launch owns a moment: a countdown, then a ship. The
   first tap of a quiet pad counts 3, 2, 1, and every tap during
   that count joins the same volley. For a few seconds after
   liftoff the pad stays hot and further taps go immediately.
   Some ships keep going and leave the top of the sky. The others
   climb high, then set down somewhere along the ground, and an
   astronaut emoji hops out and waves. The rocket is the emoji, so
   it stays the same shape the button uses. There is no audio.
*/
const launchBtn = document.querySelector('.launch-button');
const countdownEl = document.getElementById('countdown');
const ASCENT_MS = 2400;
const ESCAPE_MS = 2800;
const ARC_MS = 2000;
const WAVE_MS = 1800;
const FADE_MS = 420;
const ROCKET_CAP = 12;

let airborne = 0;
let calmOn = false;
let counting = false;
let queued = 0;
let padHotUntil = 0;

function noseTilt(vx, vy) {
  return Math.atan2(vy, vx) * 180 / Math.PI + 90;
}

function angDiff(a, b) {
  let d = b - a;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function easeBlend(t) {
  return t * t * (3 - 2 * t);
}

function flightPlan() {
  const w = window.innerWidth;
  const rect = launchBtn.getBoundingClientRect();
  const ox = rect.left + rect.width / 2;
  const oy = rect.top - 8;
  const escape = Math.random() < 0.42;
  const side = Math.random() < 0.5 ? -1 : 1;
  const lane = side < 0 ? (56 - ox) : (w - 56 - ox);
  const sepX = lane * (0.92 + Math.random() * 0.06);
  const sepY = escape ? -(oy + 180) : -(oy - 36);
  const landX = sepX + (Math.random() - 0.5) * 70;
  return { escape, sepX, sepY, ox, oy, landX, landY: 36 };
}

function ascentPoint(u, sepX, sepY) {
  const slideEnd = 0.3;
  if (u <= slideEnd) {
    const s = easeBlend(u / slideEnd);
    return { x: sepX * s, y: Math.min(0, sepY * 0.03) * s };
  }
  const t = (u - slideEnd) / (1 - slideEnd);
  return { x: sepX, y: sepY * (0.03 + 0.97 * t) };
}

function quad(p0, p1, p2, t) {
  const u = 1 - t;
  return {
    x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
    y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
  };
}

function makeRocket(ox, oy) {
  const rocket = document.createElement('div');
  rocket.className = 'rocket';
  rocket.innerHTML = '<span class="rocket-emoji">🚀</span>';
  rocket.style.left = ox + 'px';
  rocket.style.top = oy + 'px';
  document.body.appendChild(rocket);
  return rocket;
}

function placeRocket(rocket, ox, oy, x, y, angle, opacity, scale) {
  rocket.style.left = (ox + x) + 'px';
  rocket.style.top = (oy + y) + 'px';
  rocket.style.transform = 'translate(-50%, -50%) rotate(' + angle.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';
  rocket.style.opacity = String(opacity);
}

function showAstronaut(x, y) {
  const el = document.createElement('div');
  el.className = 'astronaut pop';
  el.innerHTML = '<span class="astro-emoji">🧑‍🚀</span>';
  const charm = document.createElement('div');
  charm.className = 'charm';
  const tokens = {
    thanksgiving: '🍂', holiday: '⭐', valentine: '🌹', patrick: '☘️',
    spring: '🌸', sequinox: '🌸', summer: '✦', ssolstice: '☀️',
    july4: '⭐', autumn: '🍁', aequinox: '🍁', halloween: '✨', wsolstice: '✨'
  };
  charm.textContent = tokens[activeMode] || '✦';
  el.appendChild(charm);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = 'translate(-50%, -110%)';
  document.body.appendChild(el);
  return el;
}

function spawnBit(x, y, ex, ey, big) {
  const bit = document.createElement('i');
  bit.className = 'exhaust';
  const gold = Math.random() < 0.46;
  const color = gold ? '#ffd15c' : '#ff7a1a';
  const size = big ? 18 : 9 + Math.random() * 6;
  bit.style.width = size + 'px';
  bit.style.height = size + 'px';
  bit.style.background = color;
  bit.style.boxShadow = '0 0 12px ' + color;
  bit.style.left = (x + (Math.random() - 0.5) * 6) + 'px';
  bit.style.top = (y + (Math.random() - 0.5) * 6) + 'px';
  document.body.appendChild(bit);
  const dx = ex * (22 + Math.random() * 18);
  const dy = ey * (22 + Math.random() * 18);
  const life = big ? 240 : 320 + Math.random() * 120;
  bit.animate([
    { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.95 },
    { transform: 'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + dy.toFixed(1) + 'px)) scale(.2)', opacity: 0 }
  ], { duration: life, easing: 'ease-out', fill: 'forwards' });
  setTimeout(() => bit.remove(), life + 24);
  return bit;
}

function runRocket(onDone) {
  const plan = flightPlan();
  const rocket = makeRocket(plan.ox, plan.oy);
  const bits = [];
  let angle = 0;
  let lastSample = null;
  let lastNow = 0;
  let lastBurn = 0;
  let acc = 0;
  let astro = null;
  const t0 = performance.now();

  function engine(cssDeg) {
    const nose = (cssDeg - 90) * Math.PI / 180;
    return { x: -Math.cos(nose), y: -Math.sin(nose) };
  }

  function killBits() {
    while (bits.length) bits.pop().remove();
  }

  function frame(now) {
    const elapsed = now - t0;
    const climbEnd = plan.escape ? ESCAPE_MS : ASCENT_MS;
    const arcEnd = plan.escape ? climbEnd : climbEnd + ARC_MS;
    const waveEnd = plan.escape ? arcEnd : arcEnd + WAVE_MS;
    const fadeEnd = plan.escape ? arcEnd : waveEnd + FADE_MS;
    let x = 0;
    let y = 0;
    let opacity = 1;
    let scale = 1;
    let burning = false;
    let done = false;
    let follow = false;

    if (plan.escape) {
      const u = Math.min(1, elapsed / climbEnd);
      const p = ascentPoint(u, plan.sepX, plan.sepY);
      x = p.x;
      y = p.y;
      burning = u < 0.92;
      follow = true;
      scale = 1 - 0.35 * u;
      if (u > 0.8) opacity = 1 - (u - 0.8) / 0.2;
      if (elapsed >= climbEnd) done = true;
    } else if (elapsed < climbEnd) {
      const u = elapsed / climbEnd;
      const p = ascentPoint(u, plan.sepX, plan.sepY);
      x = p.x;
      y = p.y;
      burning = true;
      follow = true;
    } else if (elapsed < arcEnd) {
      const u = (elapsed - climbEnd) / ARC_MS;
      const p = quad(
        { x: plan.sepX, y: plan.sepY },
        { x: (plan.sepX + plan.landX) * 0.5, y: Math.min(plan.sepY * 0.2, -40) },
        { x: plan.landX, y: plan.landY },
        u
      );
      x = p.x;
      y = p.y;
      burning = u > 0.7;
      follow = u < 0.78;
      if (!follow) angle += angDiff(angle, 0) * 0.18;
    } else if (elapsed < waveEnd) {
      x = plan.landX;
      y = plan.landY;
      angle = 0;
      if (!astro) astro = showAstronaut(plan.ox + x + 36, plan.oy + y);
    } else if (elapsed < fadeEnd) {
      x = plan.landX;
      y = plan.landY;
      angle = 0;
      opacity = 1 - (elapsed - waveEnd) / FADE_MS;
      if (astro) astro.style.opacity = String(Math.max(0, opacity));
    } else {
      done = true;
    }

    if (follow) {
      const sample = elapsed < climbEnd
        ? ascentPoint(Math.min(1, elapsed / climbEnd), plan.sepX, plan.sepY)
        : quad(
            { x: plan.sepX, y: plan.sepY },
            { x: (plan.sepX + plan.landX) * 0.5, y: Math.min(plan.sepY * 0.2, -40) },
            { x: plan.landX, y: plan.landY },
            Math.min(1, (elapsed - climbEnd) / ARC_MS)
          );
      if (lastSample) {
        const vx = sample.x - lastSample.x;
        const vy = sample.y - lastSample.y;
        if (vx * vx + vy * vy > 0.04) {
          const target = noseTilt(vx, vy);
          const k = 1 - Math.exp(-(now - lastNow) / 90);
          angle += angDiff(angle, target) * k;
        }
      }
      lastSample = sample;
      lastNow = now;
    }

    placeRocket(rocket, plan.ox, plan.oy, x, y, angle, Math.max(0, opacity), scale);

    if (burning) {
      const dt = lastBurn ? Math.min(now - lastBurn, 48) : 16;
      lastBurn = now;
      acc += dt;
      const e = engine(angle);
      let n = 0;
      while (acc >= 50 && n < 3) {
        acc -= 50;
        n += 1;
        bits.push(spawnBit(plan.ox + x + e.x * 36, plan.oy + y + e.y * 36, e.x, e.y, n === 1));
      }
    } else {
      acc = 0;
      lastBurn = 0;
    }

    if (done) {
      killBits();
      rocket.remove();
      if (astro) astro.remove();
      if (onDone) onDone();
      return;
    }
    requestAnimationFrame(frame);
  }

  placeRocket(rocket, plan.ox, plan.oy, 0, 0, 0, 1, 1);
  requestAnimationFrame(frame);
}

function spawnCalm() {
  const rect = launchBtn.getBoundingClientRect();
  const ox = rect.left + rect.width / 2;
  const oy = rect.top - 8;
  const rocket = makeRocket(ox, oy);
  const narrow = window.innerWidth < 520;
  const side = Math.random() < 0.5 ? -1 : 1;
  const dx = side * Math.min(window.innerWidth * 0.22, narrow ? 110 : 200);
  const dy = -Math.min(window.innerHeight * 0.28, oy * 0.4);
  const ang = noseTilt(dx, dy);
  const turn = 'translate(-50%, -50%) rotate(' + ang.toFixed(1) + 'deg)';
  rocket.animate([
    { left: ox + 'px', top: oy + 'px', transform: turn, opacity: 1 },
    { left: (ox + dx) + 'px', top: (oy + dy) + 'px', transform: turn, opacity: 0 }
  ], { duration: 900, easing: 'ease-out', fill: 'forwards' });
  setTimeout(() => {
    rocket.remove();
    calmOn = false;
  }, 960);
}

function launchOne() {
  if (airborne >= ROCKET_CAP) return;
  airborne += 1;
  runRocket(() => { airborne -= 1; });
}

function runCountdown(done) {
  const beats = ['3', '2', '1'];
  let i = 0;
  countdownEl.hidden = false;
  function step() {
    if (i >= beats.length) {
      countdownEl.hidden = true;
      done();
      return;
    }
    countdownEl.textContent = beats[i];
    countdownEl.classList.remove('pop');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('pop');
    i += 1;
    setTimeout(step, 620);
  }
  step();
}

launchBtn.addEventListener('click', () => {
  const calm = typeof reduceMotion !== 'undefined' && reduceMotion;
  if (calm) {
    if (calmOn) return;
    calmOn = true;
    spawnCalm();
    return;
  }
  if (airborne >= ROCKET_CAP && !counting) return;
  if (performance.now() < padHotUntil) {
    launchOne();
    return;
  }
  queued += 1;
  if (counting) return;
  counting = true;
  runCountdown(() => {
    const room = Math.max(0, ROCKET_CAP - airborne);
    const n = Math.min(queued, room);
    queued = 0;
    counting = false;
    padHotUntil = performance.now() + 8000;
    for (let i = 0; i < n; i++) launchOne();
  });
});

/* A tap on the open sky leaves one star. A tap on the name leaves a
   few sparks. Both are small on purpose, and both stay quiet when
   the visitor has asked for reduced motion. */
function spawnRipple(x, y) {
  const ring = document.createElement('div');
  ring.className = 'ripple';
  ring.style.left = x + 'px';
  ring.style.top = y + 'px';
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 900);
}

function spawnWish(x, y) {
  spawnRipple(x, y);
  const star = document.createElement('div');
  star.className = 'wish';
  star.textContent = '✦';
  star.style.left = x + 'px';
  star.style.top = y + 'px';
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 1600);
}

function spawnSparkles(x, y) {
  spawnRipple(x, y);
  for (let i = 0; i < 12; i++) {
    const bit = document.createElement('div');
    bit.className = 'sparkle';
    bit.style.left = x + 'px';
    bit.style.top = y + 'px';
    bit.style.setProperty('--sx', (Math.random() * 70 - 35) + 'px');
    bit.style.setProperty('--sy', (Math.random() * -56 - 8) + 'px');
    document.body.appendChild(bit);
    setTimeout(() => bit.remove(), 950);
  }
}

document.querySelector('.main-content').addEventListener('click', (e) => {
  if (e.target.closest('a, button, .name')) return;
  if (typeof reduceMotion !== 'undefined' && reduceMotion) return;
  spawnWish(e.clientX, e.clientY);
});

document.querySelector('.name').addEventListener('click', (e) => {
  if (typeof reduceMotion !== 'undefined' && reduceMotion) return;
  spawnSparkles(e.clientX, e.clientY);
});

/* ========================= SEASONAL MODES =========================
   The visitor's local date picks a scene, and that scene starts on
   when the page opens. A saved Off does not keep the season off
   after a reload. The windows are local calendar dates, and they
   leave quiet gaps so the page is a normal night for most of the year.
   The page never plays audio. Hearts and butterflies are gone because
   they made this personal page read like a greeting card. Valentine
   is warm amber and rose light. Spring is blossom bulbs and a few
   plain petals, with no flyer in their place.

   Nov 1 through Jan 2      holiday        except Thanksgiving and Dec 21–23
   Fourth Thursday, November thanksgiving  Wednesday before through Sunday after
   December 21 through 23   wsolstice      the longest night
   February 13 through 15   valentine      roses and rising lanterns, no falling candles
   March 1 through 18       patrick
   March 20 through 22      sequinox       day and night, even
   March 23 through May 31  spring         flowers and a bunny
   June 1 through August 31 summer         except the solstice and July 1–7
   June 20 through 22       ssolstice      the longest day, sun at the top right
   July 1 through July 7    july4          Happy Independence Day
   September                autumn         except Sep 22–24
   September 22 through 24  aequinox
   October                  halloween

   January 3 through 31, February outside the 13th through the 15th,
   and March 19 stay a plain night. Shooting stars and the ground
   lights still run. A fresh visit always follows this calendar.
   A scene picked with the switch lasts until the tab closes.

   Thanksgiving is the fourth Thursday in November, widened to the
   Wednesday before and the Sunday after. That five-day weekend is
   one scene. Those days are not also holiday mode. Holiday still
   covers the rest of November 1 through January 2. Valentine is only
   those three February days. A run from February 1 through 14 was
   too long, and it was the heart scene.

   The two controls are separate on purpose. The switch sits at the
   top left, under the bulbs and clear of the name, and it only turns
   the labeled scene on or off. It used to sit in the middle of the
   lights, which made the control the first thing on the page. The
   bottom button only advances to the next scene, so turning a scene
   off is not the same gesture as choosing a different one.
*/
const holidayBtn = document.getElementById('holidayToggle');
const holidayLabel = holidayBtn.querySelector('.holiday-label');

/* Fourth Thursday of November, then the Wednesday before it through
   the Sunday after it. The weekend is carved out of holiday mode so
   those five days are one scene, not two. */
function thanksgivingThursday(year) {
  const nov1 = new Date(year, 10, 1);
  const firstThursday = 1 + ((4 - nov1.getDay() + 7) % 7);
  return firstThursday + 21;
}

function isThanksgivingSpan(now) {
  const thursday = thanksgivingThursday(now.getFullYear());
  const day = now.getDate();
  return day >= thursday - 1 && day <= thursday + 3;
}

function thanksgivingWhen(year) {
  const thursday = thanksgivingThursday(year);
  return 'Nov ' + (thursday - 1) + '–' + (thursday + 3);
}

function seasonalMode(date) {
  const now = date || new Date();
  const month = now.getMonth();
  const day = now.getDate();
  if (month === 9) return 'halloween';
  if (month === 10 && isThanksgivingSpan(now)) return 'thanksgiving';
  if (month === 11 && day >= 21 && day <= 23) return 'wsolstice';
  if (month === 10 || month === 11 || (month === 0 && day < 3)) return 'holiday';
  if (month === 1 && day >= 13 && day <= 15) return 'valentine';
  if (month === 2 && day <= 18) return 'patrick';
  if (month === 2 && day >= 20 && day <= 22) return 'sequinox';
  if ((month === 2 && day >= 23) || month === 3 || month === 4) return 'spring';
  if (month === 5 && day >= 20 && day <= 22) return 'ssolstice';
  if (month === 6 && day <= 7) return 'july4';
  if (month === 5 || month === 6 || month === 7) return 'summer';
  if (month === 8 && day >= 22 && day <= 24) return 'aequinox';
  if (month === 8) return 'autumn';
  return 'off';
}

/* Applies a scene and remembers the choice.
   dataset.mode is the scene id, or it is removed when the scene is
   off, because the CSS selectors are html[data-mode="..."].
   The top switch stays labeled with switchScene after the scene is
   turned off, so the same scene can be turned back on. It hides
   only when switchScene is cleared: nothing is in season, or the
   bottom button landed on Off.
   The bottom control always reads "Next" and shows the icon of the
   following scene. The page never plays audio. Turning a scene on
   by hand still throws the sparkle from the switch. */
function setMode(mode, opts) {
  const announce = !!(opts && opts.announce);
  activeMode = mode && mode !== 'off' ? mode : 'off';
  holidayOn = activeMode === 'holiday';
  if (activeMode === 'off') delete document.documentElement.dataset.mode;
  else {
    document.documentElement.dataset.mode = activeMode;
    switchScene = activeMode;
  }

  if (switchScene && MODE_META[switchScene]) {
    const on = activeMode === switchScene;
    const name = MODE_META[switchScene].label;
    const when = switchScene === 'thanksgiving'
      ? thanksgivingWhen(new Date().getFullYear())
      : (MODE_META[switchScene].when || '');
    holidayBtn.hidden = false;
    holidayBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    holidayLabel.textContent = name;
    holidayWhen.textContent = when;
    holidayBtn.setAttribute('aria-label', name + (when ? ', ' + when : '') + (on ? ', on. Turn off' : ', off. Turn on'));
  } else {
    holidayBtn.hidden = true;
    holidayBtn.setAttribute('aria-pressed', 'false');
    holidayBtn.removeAttribute('aria-label');
  }

  const base = switchScene || 'off';
  const idx = MODE_CYCLE.indexOf(base);
  const next = MODE_CYCLE[(idx < 0 ? 0 : idx + 1) % MODE_CYCLE.length];
  const nextName = next === 'off' ? 'Off' : MODE_META[next].label;
  modeIco.textContent = MODE_META[next].ico;
  modeLabel.textContent = 'Next';
  modeSwitch.setAttribute('aria-label', 'Next scene: ' + nextName);
  try { sessionStorage.setItem('site-mode', choice); } catch (e) {}

  paintLitter();
  showToast(MODE_META[activeMode].toastOn);
  if (activeMode === 'off') {
    stopEffects();
    if (!reduceMotion) queueFlyer(owlFly, 700);
  } else {
    startEffects();
    if (announce) burstFromButton();
  }
}

function paintLitter() {
  const pack = LITTER[activeMode] || [];
  const mid = Math.ceil(pack.length / 2);
  const sides = [pack.slice(0, mid), pack.slice(mid)];
  document.querySelectorAll('#litter b').forEach((el, i) => {
    el.replaceChildren(...sides[i].map((glyph) => {
      const span = document.createElement('span');
      span.textContent = glyph;
      return span;
    }));
  });
}

function showToast(text) {
  if (!text) return;
  holidayToast.textContent = text;
  holidayToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => holidayToast.classList.remove('show'), 4800);
}

function flyerAllowed(el) {
  if (el === santaFly) return activeMode === 'holiday';
  if (el === witchFly || el === batFly) return activeMode === 'halloween';
  if (el === lepFly) return activeMode === 'patrick';
  if (el === turkeyFly) return activeMode === 'thanksgiving';
  if (el === geeseFly) return activeMode === 'autumn' || activeMode === 'aequinox';
  if (el === owlFly) return activeMode === 'off';
  return false;
}

function stopFlyer(el) {
  clearTimeout(el._timer);
  clearTimeout(el._ho);
  clearTimeout(el._hoOff);
  el.hidden = true;
  el.classList.remove('cheering', 'parked');
  el.style.animation = 'none';
}

function queueFlyer(el, delay) {
  clearTimeout(el._timer);
  el._timer = setTimeout(() => launchFlyer(el), delay);
}

/* One character crosses the upper sky, then waits. Most passes stay
   high so they miss the name. Text is z-index 6 and flyers are 5,
   so a crossing still cannot cover the title. Reduced motion parks
   the character in view instead of sending it across. */
function launchFlyer(el) {
  if (!flyerAllowed(el) || reduceMotion) return;
  const duration = rand(el === owlFly || el === geeseFly ? 9 : 7.5, el === owlFly ? 13 : 11);
  el.hidden = false;
  el.classList.remove('cheering');
  el.style.top = rand(2, 7) + 'vh';
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'santaCross ' + duration + 's linear forwards';
  if (el !== batFly) {
    el._ho = setTimeout(() => el.classList.add('cheering'), duration * 320);
    el._hoOff = setTimeout(() => el.classList.remove('cheering'), duration * 680);
  }
  el._timer = setTimeout(() => {
    el.hidden = true;
    el.classList.remove('cheering');
    const gap = (el === owlFly || el === geeseFly) ? rand(14000, 22000) : rand(1400, 2800);
    if (flyerAllowed(el)) queueFlyer(el, gap);
  }, duration * 1000 + 40);
}

function startEffects() {
  stopEffects();
  initSnow();
  rockets = [];
  sparks = [];
  nextFirework = 0;
  const lead = activeMode === 'holiday' ? santaFly : activeMode === 'halloween' ? witchFly : activeMode === 'patrick' ? lepFly : activeMode === 'thanksgiving' ? turkeyFly : null;
  const hop = activeMode === 'spring' || activeMode === 'sequinox';
  bunny.hidden = !hop;
  if (reduceMotion) {
    if (lead) {
      lead.hidden = false;
      lead.classList.add('parked');
    }
    return;
  }
  if (lead) queueFlyer(lead, 0);
  if (activeMode === 'halloween') queueFlyer(batFly, 400);
  if (activeMode === 'autumn' || activeMode === 'aequinox') queueFlyer(geeseFly, 200);
  queueGift(280);
}

function stopEffects() {
  clearTimeout(giftTimer);
  [santaFly, witchFly, batFly, lepFly, turkeyFly, geeseFly, owlFly].forEach(stopFlyer);
  if (bunny) bunny.hidden = true;
  document.querySelectorAll('.gift').forEach((g) => g.remove());
  dust = [];
  rockets = [];
  sparks = [];
}

function queueGift(delay) {
  clearTimeout(giftTimer);
  giftTimer = setTimeout(() => {
    const pack = GIFT_EMOJI[activeMode];
    if (!pack || reduceMotion) return;
    const leafy = activeMode === 'autumn' || activeMode === 'aequinox' || activeMode === 'thanksgiving';
    const cap = activeMode === 'valentine' ? 4 : leafy ? 6 : 3;
    if (document.querySelectorAll('.gift').length < cap) spawnGift(pack);
    queueGift(leafy ? rand(900, 1600) : rand(2200, 4000));
  }, delay);
}

function spawnGift(pack) {
  const el = document.createElement('div');
  el.className = activeMode === 'valentine' ? 'gift rise' : 'gift';
  el.textContent = pack[(Math.random() * pack.length) | 0];
  el.style.left = (Math.random() < 0.5 ? rand(3, 16) : rand(82, 96)) + 'vw';
  el.style.fontSize = rand(18, 34) + 'px';
  el.style.animationDuration = rand(7, 12) + 's';
  el.style.setProperty('--drift', rand(-70, 90) + 'px');
  document.body.appendChild(el);
  const life = parseFloat(el.style.animationDuration) * 1000 + 200;
  setTimeout(() => el.remove(), life);
}

function burstFromButton() {
  const rect = holidayBtn.getBoundingClientRect();
  const x = (rect.left + rect.width / 2) * dpr;
  const y = rect.bottom * dpr;
  for (let i = 0; i < 28; i++) {
    const ang = rand(-Math.PI, 0);
    const spd = rand(0.8, 3.2);
    dust.push({
      x: x,
      y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd * 0.65,
      life: 1,
      r: rand(1.1, 2.6),
      gold: Math.random() < 0.6
    });
  }
}

/* One canvas draws snow, coins, gold-brown leaves, or petals.
   Valentine draws nothing here. Hearts read wrong on this personal
   page, so that scene is the amber and rose bulbs and a candle.
   Spring is a few plain petals, not a butterfly and not a stand-in
   creature. Thanksgiving is a few slow gold-brown leaves, not the
   Halloween orange and purple swarm. A full field would turn those
   quiet seasons into a blizzard. */
function makeFlake(anywhere) {
  const gentle = activeMode === 'spring' || activeMode === 'sequinox' || activeMode === 'thanksgiving' || activeMode === 'autumn' || activeMode === 'aequinox' || activeMode === 'summer' || activeMode === 'ssolstice';
  const roll = Math.random();
  const leafy = activeMode === 'thanksgiving' || activeMode === 'autumn' || activeMode === 'aequinox';
  const petal = activeMode === 'spring' || activeMode === 'sequinox';
  const glow = activeMode === 'summer' || activeMode === 'ssolstice';
  return {
    x: Math.random() * Math.max(snowCanvas.width, 1),
    y: anywhere ? Math.random() * Math.max(snowCanvas.height, 1) : -rand(4, 40),
    r: gentle ? rand(2.4, 4.4) : rand(0.6, 2.7),
    vy: gentle ? rand(0.08, 0.28) : rand(0.28, 0.95),
    vx: rand(-0.18, 0.18),
    wobble: rand(0, Math.PI * 2),
    wobbleSpeed: gentle ? rand(0.003, 0.01) : rand(0.01, 0.025),
    o: rand(0.4, 0.9),
    hue: Math.random(),
    kind: leafy ? 'leaf' : petal ? 'petal' : glow ? 'glow' : (roll > 0.86 ? 'star' : 'dot')
  };
}

function initSnow() {
  let count = Math.min(200, Math.floor((innerWidth * innerHeight) / 13000));
  if (activeMode === 'valentine') count = 0;
  else if (activeMode === 'thanksgiving') count = Math.min(22, Math.max(8, Math.floor(innerWidth / 90)));
  else if (activeMode === 'spring' || activeMode === 'sequinox') count = Math.min(70, Math.max(28, Math.floor(innerWidth / 22)));
  else if (activeMode === 'autumn' || activeMode === 'aequinox') count = Math.min(36, Math.max(16, Math.floor(innerWidth / 40)));
  else if (activeMode === 'summer' || activeMode === 'ssolstice') count = Math.min(26, Math.max(12, Math.floor(innerWidth / 55)));
  flakes = [];
  for (let i = 0; i < count; i++) flakes.push(makeFlake(true));
}

function drawSnowflake(x, y, r, alpha) {
  sctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
  sctx.lineWidth = Math.max(1, dpr * 0.7);
  sctx.beginPath();
  for (let a = 0; a < 6; a++) {
    const ang = a * Math.PI / 3;
    sctx.moveTo(x, y);
    sctx.lineTo(x + Math.cos(ang) * r * 3.1, y + Math.sin(ang) * r * 3.1);
  }
  sctx.stroke();
}

function paintFlake(f) {
  if (f.kind === 'glow') {
    sctx.fillStyle = 'rgba(255, 214, 120,' + f.o + ')';
    sctx.beginPath();
    sctx.arc(f.x, f.y, (f.r + 0.6) * dpr, 0, Math.PI * 2);
    sctx.fill();
    return;
  }
  if (f.kind === 'leaf') {
    const color = f.hue > 0.66
      ? 'rgba(196,132,74,' + f.o + ')'
      : f.hue > 0.33
        ? 'rgba(224,168,72,' + f.o + ')'
        : 'rgba(122,74,36,' + f.o + ')';
    sctx.save();
    sctx.translate(f.x, f.y);
    sctx.rotate(f.wobble);
    sctx.fillStyle = color;
    sctx.beginPath();
    sctx.ellipse(0, 0, f.r * dpr * 2.1, f.r * dpr * 0.85, 0, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();
    return;
  }
  if (f.kind === 'petal') {
    const color = f.hue > 0.66
      ? 'rgba(255,214,226,' + f.o + ')'
      : f.hue > 0.33
        ? 'rgba(255,236,210,' + f.o + ')'
        : 'rgba(255,176,198,' + f.o + ')';
    sctx.save();
    sctx.translate(f.x, f.y);
    sctx.rotate(f.wobble);
    sctx.fillStyle = color;
    sctx.beginPath();
    sctx.ellipse(0, 0, f.r * dpr * 2.3, f.r * dpr * 0.95, 0, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();
    return;
  }
  if (activeMode === 'patrick') {
    sctx.fillStyle = 'rgba(242,193,78,' + f.o + ')';
    sctx.beginPath();
    sctx.arc(f.x, f.y, (f.r + 0.8) * dpr, 0, Math.PI * 2);
    sctx.fill();
    return;
  }
  if (activeMode === 'halloween') {
    sctx.fillStyle = f.kind === 'star' ? 'rgba(255,140,40,' + f.o + ')' : 'rgba(190,140,255,' + f.o + ')';
    sctx.beginPath();
    sctx.ellipse(f.x, f.y, f.r * dpr * 1.8, f.r * dpr * 0.7, f.wobble, 0, Math.PI * 2);
    sctx.fill();
    return;
  }
  if (f.kind === 'star') drawSnowflake(f.x, f.y, f.r * dpr, f.o);
  else {
    sctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r * dpr, 0, Math.PI * 2);
    sctx.fill();
  }
}

function starTint(s) {
  if (activeMode === 'holiday' && s.depth > 0.72) return s.phase > 3 ? '#ffe08a' : '#d7f6ff';
  if (activeMode === 'halloween' && s.depth > 0.6) return s.phase > 3 ? '#ffb15a' : '#e2c6ff';
  if (activeMode === 'july4' && s.depth > 0.55) return ['#ff7a7a', '#ffffff', '#8ecbff'][Math.floor(s.phase) % 3];
  if (activeMode === 'patrick' && s.depth > 0.6) return s.phase > 3 ? '#d6ff9a' : '#ffe08a';
  if (activeMode === 'valentine' && s.depth > 0.72) return s.phase > 3 ? '#ffd0b0' : '#ffe08a';
  if (activeMode === 'spring' && s.depth > 0.72) return s.phase > 3 ? '#ffe9b0' : '#ffd6e4';
  if (activeMode === 'thanksgiving' && s.depth > 0.72) return s.phase > 3 ? '#e8b86a' : '#c4844a';
  if ((activeMode === 'summer' || activeMode === 'ssolstice') && s.depth > 0.7) return '#fff1c4';
  if ((activeMode === 'autumn' || activeMode === 'aequinox') && s.depth > 0.7) return s.phase > 3 ? '#f0c86a' : '#e09040';
  if (activeMode === 'wsolstice' && s.depth > 0.55) return s.phase > 3 ? '#fff' : '#d7f6ff';
  if (activeMode === 'sequinox' && s.depth > 0.7) return s.phase > 3 ? '#fff1c9' : '#d7f6ff';
  return '#ffffff';
}

function shootingTint() {
  if (activeMode === 'halloween') return 'rgba(255,160,60,0.95)';
  if (activeMode === 'july4') return 'rgba(255,255,255,0.95)';
  if (activeMode === 'patrick') return 'rgba(190,255,150,0.95)';
  if (activeMode === 'holiday') return 'rgba(255,224,138,0.95)';
  if (activeMode === 'valentine') return 'rgba(255,196,150,0.95)';
  if (activeMode === 'spring') return 'rgba(255,224,170,0.95)';
  if (activeMode === 'thanksgiving') return 'rgba(224,168,80,0.95)';
  if (activeMode === 'summer' || activeMode === 'ssolstice') return 'rgba(255,220,140,0.95)';
  if (activeMode === 'autumn' || activeMode === 'aequinox') return 'rgba(240,170,80,0.95)';
  if (activeMode === 'wsolstice' || activeMode === 'sequinox') return 'rgba(220,236,255,0.95)';
  return 'rgba(255,255,255,0.90)';
}

function burstFirework(x, y, color) {
  for (let i = 0; i < 46; i++) {
    const ang = (i / 46) * Math.PI * 2 + rand(-0.08, 0.08);
    const spd = rand(0.5, 2.5) * dpr;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      r: rand(1.8, 3.4),
      color: Math.random() < 0.22 ? '#ffffff' : color
    });
  }
}

/* July 4 uses the same canvas as the falling particles, but with a
   few rockets instead. Each one climbs, bursts, and fades. Reduced
   motion skips this so the sky stays still. */
function drawFireworks(dt, now, sw, sh) {
  if (now > nextFirework && rockets.length < 4) {
    nextFirework = now + rand(160, 520);
    rockets.push({
      x: rand(sw * 0.15, sw * 0.85),
      y: sh * 0.96,
      vx: rand(-0.4, 0.4) * dpr,
      vy: -rand(3.4, 5.2) * dpr,
      color: ['#ff4b4b', '#ffffff', '#79b8ff', '#ffd24d'][(Math.random() * 4) | 0],
      life: rand(520, 900)
    });
  }
  sctx.clearRect(0, 0, sw, sh);
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx * dt * 0.16;
    r.y += r.vy * dt * 0.16;
    r.vy += 0.0015 * dt;
    r.life -= dt;
    sctx.globalAlpha = 0.95;
    sctx.strokeStyle = 'rgba(255,246,216,0.85)';
    sctx.lineWidth = 2 * dpr;
    sctx.beginPath();
    sctx.moveTo(r.x, r.y);
    sctx.lineTo(r.x - r.vx * 8, r.y - r.vy * 6);
    sctx.stroke();
    if (r.life <= 0) {
      burstFirework(r.x, r.y, r.color);
      rockets.splice(i, 1);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt * 0.16;
    p.y += p.vy * dt * 0.16;
    p.vy += 0.0035 * dt;
    p.life -= dt / 980;
    if (p.life <= 0) {
      sparks.splice(i, 1);
      continue;
    }
    sctx.globalAlpha = Math.max(0, p.life);
    sctx.fillStyle = p.color;
    sctx.beginPath();
    sctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
  if (sparks.length > 420) sparks.splice(0, sparks.length - 420);
}

/* Top switch: toggle the scene it is labeled with. It does not cycle.
   Off stores "off" for the rest of this visit and leaves the switch
   visible. On stores that scene's id, not "auto", so a reload keeps
   the scene they picked. A stored "off" does not keep the calendar
   scene off after a reload. */
holidayBtn.addEventListener('click', () => {
  if (!switchScene) return;
  if (activeMode === switchScene) {
    choice = 'off';
    setMode('off', { announce: true });
  } else {
    choice = switchScene;
    setMode(switchScene, { announce: true });
  }
});

/* Bottom button: one step forward. The step is taken from the labeled
   scene, even if that scene is currently switched off. Landing on
   Off clears the top switch. Any other step turns that scene on. */
modeSwitch.addEventListener('click', () => {
  const base = switchScene || 'off';
  const current = MODE_CYCLE.indexOf(base);
  const next = MODE_CYCLE[(current < 0 ? 0 : current + 1) % MODE_CYCLE.length];
  choice = next;
  switchScene = next === 'off' ? null : next;
  setMode(next, { announce: true });
});

/* ========================= STARFIELD ========================= */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d', { alpha: true });
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let dpr = 1;
let stars = [];
let shootingStars = [];
let nextShootingStarAt = 0;
let nextShowerAt = 0;

const pointer = { x: 0.5, y: 0.5 };
const smooth = { x: 0.5, y: 0.5 };

addEventListener('mousemove', (e) => {
  pointer.x = e.clientX / innerWidth;
  pointer.y = e.clientY / innerHeight;
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (!e.touches.length) return;
  pointer.x = e.touches[0].clientX / innerWidth;
  pointer.y = e.touches[0].clientY / innerHeight;
}, { passive: true });

function rand(min, max) { return Math.random() * (max - min) + min; }

function initStars() {
  const count = Math.floor((innerWidth * innerHeight) / 2800);
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: rand(0.3, 1.4),
      o: rand(0.25, 0.85),
      depth: rand(0.15, 1.0),
      phase: rand(0, Math.PI * 2),
      speed: rand(0.0003, 0.0008)
    });
  }
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  snowCanvas.width = canvas.width;
  snowCanvas.height = canvas.height;
  snowCanvas.style.width = '100vw';
  snowCanvas.style.height = '100vh';
  snowWasOn = false;
  initStars();
  initSnow();
}

addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', resize, { passive: true });

function createShootingStar() {
  const fromLeft = Math.random() < 0.5;
  return {
    x: fromLeft ? -0.04 * canvas.width : 1.04 * canvas.width,
    y: rand(0.04, 0.28) * canvas.height,
    vx: (fromLeft ? 1 : -1) * rand(1.8, 2.6) * dpr,
    vy: rand(0.35, 0.7) * dpr,
    length: rand(64, 110) * dpr,
    width: 1.3 * dpr,
    life: rand(420, 700)
  };
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(33, now - last);
  last = now;

  const w = canvas.width;
  const h = canvas.height;

  smooth.x += (pointer.x - smooth.x) * 0.05;
  smooth.y += (pointer.y - smooth.y) * 0.05;
  const mx = smooth.x - 0.5;
  const my = smooth.y - 0.5;

  ctx.clearRect(0, 0, w, h);

  for (const s of stars) {
    const twinkle = reduceMotion ? 1 : (0.78 + 0.22 * Math.sin(s.phase + now * s.speed));
    const px = (s.x + mx * s.depth * 0.06) * w;
    const py = (s.y + my * s.depth * 0.06) * h;

    ctx.globalAlpha = s.o * twinkle;
    ctx.fillStyle = starTint(s);
    ctx.beginPath();
    ctx.arc(px, py, s.r * dpr, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  if (!reduceMotion) {
    if (shootingStars.length < 1 && now >= nextShootingStarAt) {
      shootingStars.push(createShootingStar());
      nextShootingStarAt = now + rand(7000, 14000);
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const c = shootingStars[i];
      c.x += c.vx * dt * 0.16;
      c.y += c.vy * dt * 0.16;
      c.life -= dt;

      const tx = c.x - c.vx * c.length;
      const ty = c.y - c.vy * c.length;
      const grad = ctx.createLinearGradient(c.x, c.y, tx, ty);
      grad.addColorStop(0, shootingTint());
      grad.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = c.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 2.1 * dpr, 0, Math.PI * 2);
      ctx.fill();

      if (c.life <= 0 || c.x < -0.2 * w || c.x > 1.2 * w) shootingStars.splice(i, 1);
    }
  }

  const sw = snowCanvas.width;
  const sh = snowCanvas.height;
  const fxOn = activeMode !== 'off';
  if (!fxOn) {
    if (snowWasOn) {
      sctx.clearRect(0, 0, sw, sh);
      snowWasOn = false;
      dust = [];
    }
  } else if (activeMode === 'july4' && !reduceMotion) {
    snowWasOn = true;
    drawFireworks(dt, now, sw, sh);
  } else if (!reduceMotion) {
    snowWasOn = true;
    if (now > nextWindAt) {
      windTarget = rand(-0.55, 0.55);
      nextWindAt = now + rand(2800, 7000);
    }
    wind += (windTarget - wind) * 0.012;

    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.wobble += f.wobbleSpeed * dt;
      f.y += (f.vy + f.r * 0.18) * dt * 0.07 * dpr;
      f.x += (f.vx + wind + Math.sin(f.wobble) * 0.28) * dt * 0.07 * dpr;
      if (f.y > sh + 8) {
        flakes[i] = makeFlake(false);
        continue;
      }
      if (f.x < -12) f.x = sw + 8;
      if (f.x > sw + 12) f.x = -8;
      paintFlake(f);
    }

    const trailEl = [santaFly, witchFly, lepFly, turkeyFly].find((el) => el && !el.hidden);
    if (activeMode === 'thanksgiving' && turkeyFly && !turkeyFly.hidden && Math.random() < 0.04) {
      const box = turkeyFly.getBoundingClientRect();
      if (box.width) {
        const feather = document.createElement('div');
        feather.className = 'feather';
        feather.textContent = '🪶';
        feather.style.left = (box.left + box.width * 0.35) + 'px';
        feather.style.top = (box.top + box.height * 0.55) + 'px';
        document.body.appendChild(feather);
        setTimeout(() => feather.remove(), 2700);
      }
    }
    if (trailEl) {
      const box = trailEl.getBoundingClientRect();
      if (Math.random() < 0.85) {
        dust.push({
          x: box.left * dpr,
          y: (box.top + box.height * 0.62) * dpr,
          vx: -rand(0.15, 1.1) * dpr,
          vy: rand(-0.25, 0.35) * dpr,
          life: 1,
          r: rand(1, 2.4),
          gold: Math.random() < 0.75
        });
      }
    }

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * dt * 0.16;
      p.y += p.vy * dt * 0.16;
      p.vy += 0.004 * dt;
      p.life -= dt / 700;
      if (p.life <= 0) {
        dust.splice(i, 1);
        continue;
      }
      sctx.globalAlpha = Math.max(0, p.life);
      sctx.fillStyle = p.gold
        ? (activeMode === 'halloween' ? '#ffb15a' : activeMode === 'valentine' ? '#e8b090' : activeMode === 'spring' ? '#ffd0e0' : activeMode === 'thanksgiving' ? '#c4844a' : '#ffe08a')
        : '#ffffff';
      sctx.beginPath();
      sctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;
    if (dust.length > 90) dust.splice(0, dust.length - 90);
  } else if (!snowWasOn) {
    snowWasOn = true;
    sctx.clearRect(0, 0, sw, sh);
    for (let i = 0; i < flakes.length; i++) paintFlake(flakes[i]);
  }

  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

/* A fresh visit follows the visitor's local calendar. An older
   localStorage scene was winning over the date, so opening the
   site could show last week's scene. That key is dropped. A scene
   picked in this tab is kept in sessionStorage until the tab
   closes, and a new visit starts from the date again. */
try { localStorage.removeItem('site-mode'); } catch (e) {}
try { localStorage.removeItem('holiday-mode'); } catch (e) {}
try {
  const saved = sessionStorage.getItem('site-mode');
  if (saved && MODE_META[saved]) choice = saved;
} catch (e) {}
if (choice === 'auto') {
  const season = seasonalMode();
  switchScene = season === 'off' ? null : season;
  setMode(season);
} else {
  switchScene = choice;
  setMode(choice);
}
